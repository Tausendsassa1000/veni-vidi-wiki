<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veni, vidi, wiki</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; }
        .container { max-width: 760px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 18px; gap: 10px; }
        .header-title { text-align: left; }
        h1 { margin: 0; font-size: 1.85rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 3px; }

        .sound-btn { background: #f1f5f9; border: 1.5px solid #cbd5e1; color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .sound-btn:hover { background: #e2e8f0; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        @media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } }

        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: #fff; color: var(--text); }
        select:focus, input:focus { outline: none; border-color: var(--primary); }

        .player-setup { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
        .player-input-row { display: flex; gap: 8px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 32px; }
        .player-tag { background: var(--primary); color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .player-tag button { background: rgba(255,255,255,0.25); border: none; color: white; font-weight: bold; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem; line-height: 1; padding: 0; }
        .player-tag button:hover { background: rgba(255,255,255,0.45); }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.15s; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-small { padding: 9px 14px; font-size: 0.9rem; width: auto; white-space: nowrap; }

        .hidden { display: none !important; }

        /* Statusleiste Handy-optimiert & fixiert */
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; gap: 8px; flex-wrap: nowrap; }
        .status-left { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .status-badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .badge { padding: 5px 8px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .badge-round { background: #e2e8f0; color: #334155; }
        .badge-points { background: #dbeafe; color: #1e40af; }
        .badge-timer { background: #fef3c7; color: #92400e; min-width: 68px; text-align: center; display: inline-block; }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }

        @media (max-width: 480px) {
            .container { padding: 14px; }
            h1 { font-size: 1.5rem; }
            .status-bar { padding: 8px 10px; gap: 6px; }
            .status-left { font-size: 0.82rem; }
            .badge { padding: 4px 6px; font-size: 0.78rem; }
            .badge-timer { min-width: 58px; }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .tiebreaker-banner { background: #fef3c7; border: 2px solid #f59e0b; color: #92400e; padding: 10px 14px; border-radius: 10px; font-weight: 700; text-align: center; margin-bottom: 14px; }

        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.65; font-size: 1.02rem; min-height: 120px; }
        .wiki-paragraph { margin-bottom: 12px; animation: fadeIn 0.35s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 3px; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 520px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 12px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

        .text-input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

        .feedback { padding: 14px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }

        .scoreboard { margin-top: 18px; border-top: 2px solid #e2e8f0; padding-top: 12px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .score-card { background: #f1f5f9; padding: 7px 12px; border-radius: 8px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }

        .podium-box { text-align: center; padding: 20px 10px; }
        .podium-list { max-width: 420px; margin: 16px auto; text-align: left; display: flex; flex-direction: column; gap: 8px; }
        .podium-item { display: flex; justify-content: space-between; padding: 12px 16px; border-radius: 10px; background: #f1f5f9; font-weight: 600; }
        .podium-item.first { background: #fef3c7; border: 2px solid #f59e0b; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>Veni, vidi, <span>wiki</span></h1>
            <div class="subtitle">Errate den Wikipedia-Eintrag – weniger Hinweise = mehr Punkte!</div>
        </div>
        <button type="button" id="sound-toggle-btn" class="sound-btn">🔊 Ton an</button>
    </header>

    <!-- STARTMENÜ -->
    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select">Sprache der Artikel</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch (Standard)</option>
                    <option value="en">Englisch</option>
                    <option value="fr">Französisch</option>
                    <option value="it">Italienisch</option>
                </select>
            </div>
            <div>
                <label for="category-select">Kategorie</label>
                <select id="category-select">
                    <option value="all" selected>🎲 Quer-durch (Alle Kategorien)</option>
                    <option value="people">👤 Persönlichkeiten</option>
                    <option value="places">🌍 Länder, Städte & Bauwerke</option>
                    <option value="nature">🦁 Tiere & Natur</option>
                    <option value="culture">🎬 Film, Musik & Kultur</option>
                    <option value="science">🔬 Wissenschaft & Erfindung</option>
                    <option value="sport">⚽ Sport</option>
                    <option value="food">🧀 Essen & Trinken</option>
                </select>
            </div>
            <div>
                <label for="difficulty-select">Schwierigkeitsgrad</label>
                <select id="difficulty-select">
                    <option value="easy">🟢 Leicht</option>
                    <option value="medium" selected>🟡 Mittel (Standard)</option>
                    <option value="hard">🔴 Experte</option>
                </select>
            </div>
            <div>
                <label for="input-mode">Rate-Modus</label>
                <select id="input-mode">
                    <option value="mc" selected>Multiple Choice (4 Auswahlmöglichkeiten)</option>
                    <option value="text">Freies Textfeld</option>
                </select>
            </div>
            <div>
                <label for="rounds-input">Runden pro Spieler</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
            <div>
                <label for="timer-select">Timer pro Runde</label>
                <select id="timer-select">
                    <option value="30">30 Sekunden</option>
                    <option value="45" selected>45 Sekunden</option>
                    <option value="60">60 Sekunden</option>
                    <option value="0">Kein Timer</option>
                </select>
            </div>
        </div>

        <div class="player-setup">
            <label for="player-name-input">Spielende (Solo = 1 Name, Multiplayer = mehrere Namen hinzufügen)</label>
            <div class="player-input-row">
                <input type="text" id="player-name-input" placeholder="Name eingeben & + drücken..." maxlength="22" autocomplete="off">
                <button type="button" id="add-player-btn" class="btn btn-small">+ Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button type="button" id="start-game-btn" class="btn">Spiel starten</button>
    </div>

    <!-- SPIELFELD -->
    <div id="game-screen" class="hidden">
        <div id="tiebreaker-banner" class="tiebreaker-banner hidden">⚡ STECHEN! Entscheidungsrunde der Punktgleichen</div>

        <div class="status-bar">
            <div class="status-left">
                <strong id="current-player-display">Spieler 1</strong> · <span id="category-badge">Quer-durch</span>
            </div>
            <div class="status-badges">
                <span class="badge badge-round" id="round-badge">R 1/10</span>
                <span class="badge badge-points" id="points-badge">3 Pkt.</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text">
            Lade Wikipedia-Artikel...
        </div>

        <div id="feedback-box" class="feedback hidden"></div>

        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="Gesuchten Begriff eintippen..." autocomplete="off">
            <button type="button" id="submit-guess-btn" class="btn btn-small">Prüfen</button>
        </div>

        <div class="controls-row">
            <button type="button" id="hint-btn" class="btn btn-secondary btn-small">🔍 Mehr Text (-1 Pkt.)</button>
            <button type="button" id="next-round-btn" class="btn btn-small hidden">Weiter ➔</button>
            <button type="button" id="menu-btn" class="btn btn-secondary btn-small">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <!-- SIEGEREHRUNG -->
    <div id="end-screen" class="podium-box hidden">
        <h2>🏆 Spiel beendet!</h2>
        <div id="winner-announcement" style="font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 10px;"></div>
        <div class="podium-list" id="podium-list"></div>
        <div style="max-width: 300px; margin: 20px auto 0;">
            <button type="button" id="restart-btn" class="btn">Neues Spiel</button>
        </div>
    </div>
</div>

            label: "Essen & Trinken",
            clusters: [
                {
                    easy: ["Pizza", "Fondue", "Raclette", "Sushi", "Spaghetti", "Hamburger", "Rösti", "Lasagne"],
                    medium: ["Paella", "Risotto", "Gulasch", "Tapas", "Wiener Schnitzel", "Sauerkraut", "Falafel", "Hummus"],
                    hard: ["Bouillabaisse", "Zürcher Geschnetzeltes", "Borschtsch", "Ceviche", "Kimchi", "Dim Sum", "Ratatouille"]
                },
                {
                    easy: ["Emmentaler", "Gruyère (Käse)", "Mozzarella", "Parmesan", "Gouda (Käse)", "Camembert", "Feta"],
                    medium: ["Appenzeller (Käse)", "Tilsiter", "Brie (Käse)", "Roquefort", "Gorgonzola", "Mascarpone", "Ricotta"],
                    hard: ["Sbrinz", "Tête de Moine", "Vacherin Mont-d’Or", "Manchego", "Halloumi", "Comté (Käse)"]
                },
                {
                    easy: ["Kaffee", "Tee", "Bier", "Wein", "Champagner", "Kakao (Getränk)", "Mineralwasser"],
                    medium: ["Espresso", "Cappuccino", "Matcha", "Whisky", "Apfelwein", "Mate-Tee", "Limonade"],
                    hard: ["Absinth", "Sake", "Grappa", "Kirschwasser", "Kombucha", "Kefir", "Portwein"]
                },
                {
                    easy: ["Schokolade", "Croissant", "Tiramisu", "Apfelstrudel", "Brezel", "Pfannkuchen", "Baguette"],
                    medium: ["Schwarzwälder Kirschtorte", "Sachertorte", "Bündner Nusstorte", "Baklava", "Macaron", "Lebkuchen"],
                    hard: ["Zuger Kirschtorte", "Engadiner Nusstorte", "Crème brûlée", "Panna cotta", "Panettone", "Stollen (Gebäck)"]
                }
            ]
        }
    };

    // --- ZUSTANDSVARIABLEN ---
    let players = [{ name: "Spieler 1", score: 0, isPlaceholder: true }];
    let activePlayerIndices = [];
    let turnPointer = 0;
    let totalRoundsPerPlayer = 10;
    let currentRoundNumber = 1;
    let isTiebreaker = false;

    let sessionUsedTerms = new Set();
    let currentTargetDe = "";
    let currentDisplayTitle = "";
    let currentCategoryKey = "";
    let currentCluster = null;
    let paragraphs = [];
    let revealedCount = 1;
    let possiblePoints = 3;
    let roundActive = false;
    let timerInterval = null;
    let timeLeft = 45;
    let soundEnabled = true;
    let audioCtx = null;

    // --- ELEMENTE REFERENZIEREN ---
    const playerNameInput = document.getElementById("player-name-input");
    const addPlayerBtn = document.getElementById("add-player-btn");
    const playerTagsContainer = document.getElementById("player-tags");
    const startGameBtn = document.getElementById("start-game-btn");
    const soundToggleBtn = document.getElementById("sound-toggle-btn");
    const hintBtn = document.getElementById("hint-btn");
    const nextRoundBtn = document.getElementById("next-round-btn");
    const menuBtn = document.getElementById("menu-btn");
    const restartBtn = document.getElementById("restart-btn");
    const guessInput = document.getElementById("guess-input");
    const submitGuessBtn = document.getElementById("submit-guess-btn");

    // --- SOUND-SYSTEM (WEB AUDIO API) ---
    function playSound(type) {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === "win") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === "lose") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.35);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                osc.start(now);
                osc.stop(now + 0.38);
            } else if (type === "hint") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === "tick") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === "fanfare") {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = "triangle";
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.18, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.35);
                });
            }
        } catch (e) {}
    }

    soundToggleBtn.addEventListener("click", function() {
        soundEnabled = !soundEnabled;
        soundToggleBtn.textContent = soundEnabled ? "🔊 Ton an" : "🔇 Ton aus";
    });

    // --- SPIELER-VERWALTUNG ---
    function renderPlayerTags() {
        playerTagsContainer.innerHTML = "";
        players.forEach(function(p, idx) {
            const tag = document.createElement("div");
            tag.className = "player-tag";

            const span = document.createElement("span");
            span.textContent = p.name;
            tag.appendChild(span);

            if (players.length > 1) {
                const delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.textContent = "×";
                delBtn.setAttribute("aria-label", p.name + " entfernen");
                delBtn.addEventListener("click", function() {
                    players.splice(idx, 1);
                    renderPlayerTags();
                });
                tag.appendChild(delBtn);
            }
            playerTagsContainer.appendChild(tag);
        });
    }

    function handleAddPlayer() {
        const rawName = playerNameInput.value.trim();
        if (!rawName) {
            playerNameInput.focus();
            return;
        }
        if (players.length >= 10) return;

        // Platzhalter "Spieler 1" beim ersten echten Eintrag ersetzen
        if (players.length === 1 && players[0].isPlaceholder) {
            players = [];
        }

        players.push({ name: rawName, score: 0, isPlaceholder: false });
        playerNameInput.value = "";
        renderPlayerTags();
        playerNameInput.focus();
    }

    addPlayerBtn.addEventListener("click", handleAddPlayer);
    playerNameInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            handleAddPlayer();
        }
    });

    renderPlayerTags();

    // --- SPIELABLAUF ---
    function startGame() {
        // Falls noch Text im Eingabefeld steht, diesen direkt übernehmen
        if (playerNameInput.value.trim() !== "") {
            handleAddPlayer();
        }

        players.forEach(p => p.score = 0);
        activePlayerIndices = players.map((_, idx) => idx);
        turnPointer = 0;
        currentRoundNumber = 1;
        isTiebreaker = false;

        const roundsVal = parseInt(document.getElementById("rounds-input").value, 10);
        totalRoundsPerPlayer = (isNaN(roundsVal) || roundsVal < 1) ? 10 : Math.min(100, roundsVal);

        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("tiebreaker-banner").classList.add("hidden");

        loadNextRound();
    }

    startGameBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", function() {
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    });

    menuBtn.addEventListener("click", function() {
        clearInterval(timerInterval);
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    });

    function getCurrentPlayerIndex() {
        return activePlayerIndices[turnPointer];
    }

    function updateScoreboard() {
        const list = document.getElementById("scoreboard-list");
        const activeIdx = getCurrentPlayerIndex();
        list.innerHTML = players.map((p, idx) => `
            <div class="score-card ${idx === activeIdx ? 'active' : ''}">
                ${escapeHtml(p.name)}: <strong>${p.score} Pkt.</strong>
            </div>
        `).join("");
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function loadNextRound(retryCount = 0) {
        clearInterval(timerInterval);
        roundActive = false;
        revealedCount = 1;
        possiblePoints = 3;

        const currentIdx = getCurrentPlayerIndex();
        document.getElementById("feedback-box").classList.add("hidden");
        nextRoundBtn.classList.add("hidden");
        hintBtn.classList.remove("hidden");
        hintBtn.disabled = false;
        document.getElementById("wiki-text").innerHTML = "<em>Suche passenden Wikipedia-Eintrag...</em>";
        document.getElementById("mc-area").classList.add("hidden");
        document.getElementById("text-area").classList.add("hidden");

        document.getElementById("current-player-display").textContent = players[currentIdx].name;
        document.getElementById("round-badge").textContent = isTiebreaker ? "Stechen" : `R ${currentRoundNumber}/${totalRoundsPerPlayer}`;
        updatePointsBadge();
        updateScoreboard();

        const selectedCat = document.getElementById("category-select").value;
        const difficulty = document.getElementById("difficulty-select").value;
        const catKeys = Object.keys(DATABASE);
        currentCategoryKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;
        document.getElementById("category-badge").textContent = DATABASE[currentCategoryKey].label;

        const clusters = DATABASE[currentCategoryKey].clusters;
        currentCluster = clusters[Math.floor(Math.random() * clusters.length)];

        let pool = (currentCluster[difficulty] || []).filter(item => !sessionUsedTerms.has(item));
        if (pool.length === 0) {
            const allClusterItems = [...(currentCluster.easy || []), ...(currentCluster.medium || []), ...(currentCluster.hard || [])];
            pool = allClusterItems.filter(item => !sessionUsedTerms.has(item));
        }
        if (pool.length === 0) {
            const allCatItems = clusters.flatMap(c => [...(c.easy || []), ...(c.medium || []), ...(c.hard || [])]);
            pool = allCatItems.filter(item => !sessionUsedTerms.has(item));
        }
        if (pool.length === 0) {
            sessionUsedTerms.clear();
            pool = currentCluster[difficulty] || currentCluster.medium;
        }

        currentTargetDe = pool[Math.floor(Math.random() * pool.length)];
        sessionUsedTerms.add(currentTargetDe);

        const lang = document.getElementById("lang-select").value;

        try {
            const articleData = await fetchWikiArticle(currentTargetDe, lang, difficulty);
            if (!articleData || articleData.paragraphs.length === 0) {
                if (retryCount < 5) return loadNextRound(retryCount + 1);
            }

            currentDisplayTitle = articleData.title;
            paragraphs = articleData.paragraphs;

            // Prüfen, ob mindestens 3 sichtbare Wörter im ersten Auszug vorhanden sind
            const testRedacted = redactText(paragraphs[0], currentDisplayTitle);
            const visibleWords = testRedacted.replace(/<[^>]+>/g, " ").replace(/█+/g, " ").trim().split(/\s+/).filter(w => w.length > 1);
            if (visibleWords.length < 3 && paragraphs.length > 1) {
                revealedCount = 2;
            }

            if (revealedCount >= paragraphs.length) {
                hintBtn.classList.add("hidden");
            }

            renderWikiText(false);
            await setupAnswerArea(lang, difficulty);
            roundActive = true;
            startTimer();
        } catch (err) {
            if (retryCount < 4) return loadNextRound(retryCount + 1);
            document.getElementById("wiki-text").innerHTML = "Verbindungsproblem mit Wikipedia. Bitte auf Weiter klicken.";
            nextRoundBtn.classList.remove("hidden");
        }
    }

    async function fetchWikiArticle(germanTitle, targetLang, difficulty) {
        let titleToFetch = germanTitle;

        if (targetLang !== "de") {
            const langLinkUrl = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&redirects=1&prop=langlinks&lllang=${targetLang}&format=json&origin=*`;
            const res = await fetch(langLinkUrl);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            if (pages[pageId] && pages[pageId].langlinks && pages[pageId].langlinks.length > 0) {
                titleToFetch = pages[pageId].langlinks[0]["*"];
            }
        }

        const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exintro=0&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
        const response = await fetch(apiUrl);
        const json = await response.json();
        const pages = json.query.pages;
        const page = pages[Object.keys(pages)[0]];

        if (!page || !page.extract) return null;

        let rawParagraphs = page.extract
            .split("\n")
            .map(p => p.trim())
            .filter(p => p.length > 45 && !p.startsWith("=="));

        if (rawParagraphs.length === 0) return null;

        // Im Experten-Modus ersten Absatz überspringen, falls genug Text vorhanden ist
        if (difficulty === "hard" && rawParagraphs.length > 2) {
            rawParagraphs = rawParagraphs.slice(1);
        }

        // Ersten Absatz für Stufe 1 (erster Satz) und Stufe 2 (Rest des Absatzes) teilen
        const firstPara = rawParagraphs[0];
        const sentenceMatch = firstPara.match(/^(.+?[.!?])(?:\s+|$)/);
        let stage1 = firstPara;
        let stage2 = rawParagraphs[1] || "";
        let stage3 = rawParagraphs[2] || "";

        if (sentenceMatch && sentenceMatch[1].length >= 35 && sentenceMatch[1].length < firstPara.length - 25) {
            stage1 = sentenceMatch[1];
            const restOfFirst = firstPara.slice(stage1.length).trim();
            stage2 = restOfFirst;
            stage3 = rawParagraphs[1] || "";
        }

        const finalParagraphs = [stage1, stage2, stage3].filter(p => p && p.trim().length > 15);

        return {
            title: page.title,
            paragraphs: finalParagraphs
        };
    }

    function redactText(text, title) {
        let result = text;

        // Alle runden und eckigen Klammern (inkl. verschachtelter Klammern, Lautschrift & Aliase) schwärzen
        let prev;
        do {
            prev = result;
            result = result.replace(/\([^()]*\)/g, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
            result = result.replace(/\[[^\[\]]*\]/g, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
        } while (result !== prev);

        // Gesuchten Titel und Namensbestandteile schwärzen
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
        const stopWords = ["der", "die", "das", "von", "und", "den", "dem", "des", "ein", "eine", "the", "and", "of", "les", "des", "del", "della"];
        const words = cleanTitle.split(/[\s\-–—]+/).filter(w => w.length > 2 && !stopWords.includes(w.toLowerCase()));

        if (cleanTitle.length > 1) {
            const fullRegex = new RegExp(escapeRegExp(cleanTitle), "gi");
            result = result.replace(fullRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
        }

        words.forEach(word => {
            const stem = word.length > 5 ? word.slice(0, -1) : word;
            const wordRegex = new RegExp(`(?<![a-zA-ZäöüÄÖÜß])${escapeRegExp(stem)}[a-zA-ZäöüÄÖÜß]*`, "gi");
            result = result.replace(wordRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
        });

        return result;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderWikiText(revealAll) {
        const container = document.getElementById("wiki-text");
        const visibleParas = paragraphs.slice(0, revealedCount);
        container.innerHTML = visibleParas.map(p => {
            const content = revealAll ? escapeHtml(p) : redactText(escapeHtml(p), currentDisplayTitle);
            return `<div class="wiki-paragraph">${content}</div>`;
        }).join("");
    }

    hintBtn.addEventListener("click", function() {
        if (!roundActive || revealedCount >= paragraphs.length) return;
        playSound("hint");
        revealedCount++;
        possiblePoints = Math.max(1, 4 - revealedCount);
        updatePointsBadge();
        renderWikiText(false);

        if (revealedCount >= paragraphs.length) {
            hintBtn.disabled = true;
        }
    });

    function updatePointsBadge() {
        document.getElementById("points-badge").textContent = `${possiblePoints} Pkt.`;
    }

    async function setupAnswerArea(lang, difficulty) {
        const mode = document.getElementById("input-mode").value;
        if (mode === "mc") {
            const mcArea = document.getElementById("mc-area");
            mcArea.classList.remove("hidden");
            mcArea.innerHTML = "Lade Auswahlmöglichkeiten...";

            // Ablenkungsbegriffe aus demselben Themen-Cluster & Schwierigkeitsgrad wählen
            let candidates = (currentCluster[difficulty] || []).filter(item => item !== currentTargetDe);
            if (candidates.length < 3) {
                const allCluster = [...(currentCluster.easy || []), ...(currentCluster.medium || []), ...(currentCluster.hard || [])];
                candidates = allCluster.filter(item => item !== currentTargetDe);
            }

            const distractorsDe = candidates.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [currentDisplayTitle];

            for (const d of distractorsDe) {
                if (lang === "de") {
                    options.push(d);
                } else {
                    try {
                        const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&redirects=1&prop=langlinks&lllang=${lang}&format=json&origin=*`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const p = j.query.pages[Object.keys(j.query.pages)[0]];
                        options.push(p && p.langlinks ? p.langlinks[0]["*"] : d);
                    } catch (e) {
                        options.push(d);
                    }
                }
            }

            options = options.sort(() => 0.5 - Math.random());
            mcArea.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mc-btn";
                btn.textContent = opt.replace(/\s*\(.*?\)\s*/g, "");
                btn.addEventListener("click", function() {
                    checkMultipleChoice(btn, opt);
                });
                mcArea.appendChild(btn);
            });
        } else {
            const textArea = document.getElementById("text-area");
            textArea.classList.remove("hidden");
            guessInput.value = "";
            guessInput.disabled = false;
            guessInput.focus();
        }
    }

    function checkMultipleChoice(btnElement, selectedOption) {
        if (!roundActive) return;
        const isCorrect = selectedOption === currentDisplayTitle;

        document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
        if (isCorrect) {
            btnElement.classList.add("correct");
            endRound(true);
        } else {
            btnElement.classList.add("wrong");
            endRound(false);
        }
    }

    function submitTextGuess() {
        if (!roundActive) return;
        const guess = guessInput.value.trim().toLowerCase();
        if (!guess) return;

        const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
        const targetParts = cleanTarget.split(" ");
        const lastName = targetParts[targetParts.length - 1];

        const isCorrect = guess === cleanTarget || (lastName.length >= 4 && guess === lastName);
        guessInput.disabled = true;
        endRound(isCorrect);
    }

    submitGuessBtn.addEventListener("click", submitTextGuess);
    guessInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            submitTextGuess();
        }
    });

    function startTimer() {
        const limit = parseInt(document.getElementById("timer-select").value, 10);
        const timerBadge = document.getElementById("timer-badge");

        if (limit === 0) {
            timerBadge.classList.add("hidden");
            return;
        }

        timerBadge.classList.remove("hidden", "urgent");
        timeLeft = limit;
        timerBadge.textContent = `⏱ ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 10) timerBadge.classList.add("urgent");
            if (timeLeft <= 5 && timeLeft > 0) playSound("tick");

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endRound(false, true);
            }
        }, 1000);
    }

    function endRound(won, timeOut = false) {
        roundActive = false;
        clearInterval(timerInterval);
        renderWikiText(true);

        const feedback = document.getElementById("feedback-box");
        feedback.classList.remove("hidden", "win", "lose");

        const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");
        const currentIdx = getCurrentPlayerIndex();

        if (won) {
            playSound("win");
            players[currentIdx].score += possiblePoints;
            feedback.classList.add("win");
            feedback.textContent = `🎉 Richtig! Gesucht war „${cleanTitle}“. +${possiblePoints} Punkt(e) für ${players[currentIdx].name}!`;
        } else {
            playSound("lose");
            feedback.classList.add("lose");
            feedback.textContent = timeOut
                ? `⏱ Zeit abgelaufen! Gesucht war „${cleanTitle}“. 0 Punkte.`
                : `❌ Leider falsch! Gesucht war „${cleanTitle}“. 0 Punkte.`;
        }

        updateScoreboard();
        hintBtn.classList.add("hidden");
        nextRoundBtn.classList.remove("hidden");
    }

    nextRoundBtn.addEventListener("click", function() {
        turnPointer++;

        // Prüfen, ob alle aktiven Spieler dieser Runde dran waren
        if (turnPointer >= activePlayerIndices.length) {
            turnPointer = 0;

            if (!isTiebreaker) {
                currentRoundNumber++;
                if (currentRoundNumber > totalRoundsPerPlayer) {
                    evaluateEndOfGame();
                    return;
                }
            } else {
                // Nach einer kompletten Stechen-Runde prüfen, ob jetzt ein alleiniger Sieger feststeht
                evaluateEndOfGame();
                return;
            }
        }

        loadNextRound();
    });

    function evaluateEndOfGame() {
        const maxScore = Math.max(...players.map(p => p.score));
        const topPlayers = players
            .map((p, idx) => ({ ...p, idx }))
            .filter(p => p.score === maxScore);

        // Stechen auslösen, falls mehr als 1 Spieler im Multiplayer punktgleich vorne liegt
        if (players.length > 1 && topPlayers.length > 1) {
            isTiebreaker = true;
            activePlayerIndices = topPlayers.map(p => p.idx);
            turnPointer = 0;
            document.getElementById("tiebreaker-banner").classList.remove("hidden");
            loadNextRound();
            return;
        }

        // Siegerehrung anzeigen
        playSound("fanfare");
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");

        const sorted = [...players].sort((a, b) => b.score - a.score);
        document.getElementById("winner-announcement").textContent = players.length > 1
            ? `Herzlichen Glückwunsch, ${sorted[0].name}!`
            : `Dein Endergebnis: ${sorted[0].score} Punkte!`;

        const medals = ["🥇", "🥈", "🥉"];
        document.getElementById("podium-list").innerHTML = sorted.map((p, i) => `
            <div class="podium-item ${i === 0 ? 'first' : ''}">
                <span>${medals[i] || (i + 1) + "."} ${escapeHtml(p.name)}</span>
                <span>${p.score} Punkte</span>
            </div>
        `).join("");
    }
});
</script>
