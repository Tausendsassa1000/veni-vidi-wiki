<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veni, vidi, wiki</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; }
        .container { max-width: 780px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 22px; }
        
        header { position: relative; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; }
        h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }

        .sound-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            color: var(--text);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .sound-toggle:hover { background: #e2e8f0; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        @media (max-width: 600px) {
            .setup-grid { grid-template-columns: 1fr; }
            .sound-toggle { position: static; margin-top: 10px; }
        }

        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.98rem; background: #fff; color: var(--text); }
        select:focus, input:focus { outline: none; border-color: var(--primary); }

        .player-setup { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .player-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .player-tag button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0; font-size: 1.1rem; line-height: 1; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover:not(:disabled) { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
        .btn-small { padding: 8px 14px; font-size: 0.9rem; width: auto; }

        .hidden { display: none !important; }

        /* Fixierte Statusleiste für Handy & Desktop */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .status-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .player-turn {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta-line {
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .badge {
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        .badge-points { background: #dbeafe; color: #1e40af; min-width: 68px; }
        .badge-timer { background: #fef3c7; color: #92400e; min-width: 72px; }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }

        @media (max-width: 420px) {
            .status-bar { padding: 8px 10px; gap: 6px; }
            .badge { padding: 4px 6px; font-size: 0.8rem; }
            .badge-points { min-width: 60px; }
            .badge-timer { min-width: 66px; }
            .player-turn { font-size: 0.88rem; }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

        .sudden-death-banner {
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            color: #92400e;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.92rem;
        }

        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.65; font-size: 1.02rem; min-height: 120px; }
        .wiki-paragraph { margin-bottom: 12px; animation: fadeIn 0.35s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 3px; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 520px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

        .text-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

        .feedback { padding: 14px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; font-size: 0.96rem; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }

        .scoreboard { margin-top: 18px; border-top: 2px solid #e2e8f0; padding-top: 12px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .score-card { background: #f1f5f9; padding: 7px 12px; border-radius: 8px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }

        /* Siegerehrung */
        .podium-box { text-align: center; padding: 15px 5px; }
        .podium-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; color: #0f172a; }
        .podium-list { max-width: 450px; margin: 18px auto; display: flex; flex-direction: column; gap: 10px; }
        .podium-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 10px; background: #f1f5f9; font-weight: 600; font-size: 1.05rem; }
        .podium-item.first { background: #fef3c7; border: 2px solid #f59e0b; font-size: 1.15rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Veni, vidi, <span>wiki</span></h1>
        <div class="subtitle">Errate den Wikipedia-Eintrag – je weniger Hinweise, desto mehr Punkte!</div>
        <button type="button" id="sound-toggle-btn" class="sound-toggle" onclick="toggleSound()">🔊 Ton an</button>
    </header>

    <!-- STARTMENÜ -->
    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select">Sprache der Artikel</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch (Standard)</option>
                    <option value="en">Englisch</option>
                    <option value="fr">Französisch</option>
                    <option value="it">Italienisch</option>
                </select>
            </div>
            <div>
                <label for="category-select">Kategorie</label>
                <select id="category-select">
                    <option value="all" selected>🎲 Quer-durch (Alle Kategorien)</option>
                    <option value="people">👤 Persönlichkeiten</option>
                    <option value="places">🌍 Länder, Städte & Bauwerke</option>
                    <option value="nature">🦁 Tiere & Natur</option>
                    <option value="culture">🎬 Film, Musik & Kultur</option>
                    <option value="science">🔬 Wissenschaft & Erfindung</option>
                    <option value="sport">⚽ Sport</option>
                    <option value="food">🍽️ Essen & Trinken</option>
                </select>
            </div>
            <div>
                <label for="difficulty-select">Schwierigkeitsgrad</label>
                <select id="difficulty-select">
                    <option value="easy">Leicht (Bekannte Klassiker)</option>
                    <option value="medium" selected>Mittel (Ausgewogen)</option>
                    <option value="expert">Experte (Knifflig & tief im Text)</option>
                </select>
            </div>
            <div>
                <label for="input-mode">Rate-Modus</label>
                <select id="input-mode">
                    <option value="mc" selected>Multiple Choice (4 Optionen)</option>
                    <option value="text">Freies Textfeld (Für Profis)</option>
                </select>
            </div>
            <div>
                <label for="rounds-input">Runden pro Spieler</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
            <div>
                <label for="timer-select">Timer pro Runde</label>
                <select id="timer-select">
                    <option value="30">30 Sekunden</option>
                    <option value="45" selected>45 Sekunden</option>
                    <option value="60">60 Sekunden</option>
                    <option value="0">Kein Timer</option>
                </select>
            </div>
        </div>

        <div class="player-setup">
            <label for="player-name-input">Spieler (Solo = 1 Spieler, Multiplayer = mehrere Namen hinzufügen)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="Spielername eingeben..." maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault(); addPlayer();}">
                <button type="button" class="btn btn-small" onclick="addPlayer()">+ Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button type="button" class="btn" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- SPIELFELD -->
    <div id="game-screen" class="hidden">
        <div id="sudden-death-banner" class="sudden-death-banner hidden">
            ⚡ STECHEN! Gleichstand an der Spitze – Entscheidungsrunde!
        </div>

        <div class="status-bar">
            <div class="status-left">
                <div class="player-turn">Am Zug: <strong id="current-player-display">Spieler 1</strong></div>
                <div class="meta-line"><span id="round-display">Runde 1 / 10</span> · <span id="category-badge">Quer-durch</span></div>
            </div>
            <div class="status-badges">
                <span class="badge badge-points" id="points-badge">3 Pkt.</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text">
            Lade Wikipedia-Artikel...
        </div>

        <div id="feedback-box" class="feedback hidden"></div>

        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="Gesuchten Begriff eintippen..." onkeydown="if(event.key==='Enter'){event.preventDefault(); submitTextGuess();}">
            <button type="button" class="btn btn-small" onclick="submitTextGuess()">Prüfen</button>
        </div>

        <div class="controls-row">
            <button type="button" id="hint-btn" class="btn btn-secondary btn-small" onclick="revealNextHint()">🔍 Weiterer Text (-1 Pkt.)</button>
            <button type="button" id="next-round-btn" class="btn btn-small hidden" onclick="nextTurn()">Weiter ➔</button>
            <button type="button" class="btn btn-secondary btn-small" onclick="backToMenu()">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <!-- SIEGEREHRUNG -->
    <div id="victory-screen" class="hidden podium-box">
        <div class="podium-title">🏆 Spielende!</div>
        <div id="victory-subtitle" style="color: var(--muted); margin-bottom: 10px;">Hier ist das Endergebnis:</div>
        <div class="podium-list" id="podium-list"></div>
        <div style="display: flex; gap: 10px; max-width: 450px; margin: 20px auto 0;">
            <button type="button" class="btn" onclick="startGame()">Nochmal spielen</button>
            <button type="button" class="btn btn-secondary" onclick="backToMenu()">Einstellungen</button>
        </div>
    </div>
</div>

<script>
    // --- WEB AUDIO SOUND ENGINE ---
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById("sound-toggle-btn").textContent = soundEnabled ? "🔊 Ton an" : "🔇 Ton aus";
        if (soundEnabled) {
            initAudio();
            playTone(523.25, 'sine', 0.08, 0.08);
        }
    }

    function playTone(freq, type, duration, volume = 0.12, delay = 0) {
        if (!soundEnabled) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
    }

    function playSound(effect) {
        if (!soundEnabled) return;
        if (effect === 'win') {
            playTone(523.25, 'triangle', 0.14, 0.15, 0);
            playTone(659.25, 'triangle', 0.14, 0.15, 0.1);
            playTone(783.99, 'triangle', 0.25, 0.18, 0.2);
        } else if (effect === 'lose') {
            playTone(311.13, 'sawtooth', 0.18, 0.1, 0);
            playTone(233.08, 'sawtooth', 0.3, 0.1, 0.15);
        } else if (effect === 'hint') {
            playTone(440, 'sine', 0.1, 0.08, 0);
        } else if (effect === 'tick') {
            playTone(880, 'sine', 0.04, 0.05, 0);
        } else if (effect === 'fanfare') {
            playTone(523.25, 'triangle', 0.15, 0.16, 0);
            playTone(659.25, 'triangle', 0.15, 0.16, 0.12);
            playTone(783.99, 'triangle', 0.15, 0.16, 0.24);
            playTone(1046.50, 'triangle', 0.4, 0.2, 0.36);
        }
    }

    // Sitzungsweiter Speicher gegen Wiederholungen
    const sessionUsedTerms = new Set();

    let players = [{ name: "Spieler 1", score: 0 }];
    let activePlayerIndices = [];

    let totalRoundsPerPlayer = 10;
    let currentRoundNumber = 1;

    let currentTargetDe = "";
    let currentDisplayTitle = "";
    let currentCategoryKey = "";
    let currentClusterKey = "";
    let currentDifficulty = "medium";
    let paragraphs = [];
    let revealedCount = 1;
    let possiblePoints = 3;
    let roundActive = false;
    let timerInterval = null;

    // Direkt beim Laden Spieler-Tags anzeigen
    document.addEventListener("DOMContentLoaded", function() {

    function addPlayer() {
        const input = document.getElementById("player-name-input");
        if (!input) return;
        const name = input.value.trim();
        if (!name) return;

        if (players.length >= 8) {
            alert("Maximal 8 Spieler möglich.");
            return;
        }

        // Standard-Platzhalter "Spieler 1" beim ersten echten Namen ersetzen
        if (players.length === 1 && players[0].name === "Spieler 1" && players[0].isPlaceholder) {
            players = [];
        }

        players.push({ name: name, score: 0, isPlaceholder: false });
        input.value = "";
        input.focus();
        renderPlayerTags();
    }

    function removePlayer(index) {
        if (players.length > 1) {
            players.splice(index, 1);
            renderPlayerTags();
        }
    }

    function renderPlayerTags() {
        const container = document.getElementById("player-tags");
        if (!container) return;
        container.innerHTML = players.map((p, idx) => `
            <div class="player-tag">
                <span>${escapeHtml(p.name)}</span>
                ${players.length > 1 ? `<button type="button" onclick="removePlayer(${idx})" title="Entfernen">×</button>` : ''}
            </div>
        `).join("");
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Platzhalter-Flag setzen für initiales "Spieler 1"
    players[0].isPlaceholder = true;
    renderPlayerTags();

    function startGame() {
        initAudio();
        const roundsVal = parseInt(document.getElementById("rounds-input").value, 10);
        totalRoundsPerPlayer = (isNaN(roundsVal) || roundsVal < 1) ? 10 : Math.min(100, roundsVal);

        players.forEach(p => {
            p.score = 0;
            p.isPlaceholder = false;
        });

        activePlayerIndices = players.map((_, idx) => idx);
        currentTurnPointer = 0;
        currentRoundNumber = 1;
        isSuddenDeath = false;

        document.getElementById("sudden-death-banner").classList.add("hidden");
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("victory-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");

        loadNextRound();
    }

    function updateScoreboard() {
        const list = document.getElementById("scoreboard-list");
        const activePlayerIdx = activePlayerIndices[currentTurnPointer];
        list.innerHTML = players.map((p, idx) => `
            <div class="score-card ${idx === activePlayerIdx ? 'active' : ''}">
                ${escapeHtml(p.name)}: <strong>${p.score} Pkt.</strong>

        `).join("");

    async function loadNextRound(retryCount = 0) {
        clearInterval(timerInterval);
        roundActive = false;
        revealedCount = 1;
        possiblePoints = 3;

        const currentPlayerIdx = activePlayerIndices[currentTurnPointer];
        document.getElementById("feedback-box").classList.add("hidden");
        document.getElementById("next-round-btn").classList.add("hidden");
        document.getElementById("hint-btn").classList.remove("hidden");
        document.getElementById("hint-btn").disabled = false;
        document.getElementById("wiki-text").innerHTML = "<em>Lade Wikipedia-Eintrag...</em>";
        document.getElementById("mc-area").classList.add("hidden");
        document.getElementById("text-area").classList.add("hidden");

        document.getElementById("current-player-display").textContent = players[currentPlayerIdx].name;
        document.getElementById("round-display").textContent = isSuddenDeath
            ? `Stechen`
            : `Runde ${currentRoundNumber} / ${totalRoundsPerPlayer}`;

        updatePointsBadge();
        updateScoreboard();

        const selectedCat = document.getElementById("category-select").value;
        currentDifficulty = document.getElementById("difficulty-select").value;
        const catKeys = Object.keys(DATABASE);
        currentCategoryKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;

        const catObj = DATABASE[currentCategoryKey];
        document.getElementById("category-badge").textContent = catObj.label;

        const clusterKeys = Object.keys(catObj.clusters);
        currentClusterKey = clusterKeys[Math.floor(Math.random() * clusterKeys.length)];

        // Passenden Begriff aus Schwierigkeitsgrad suchen (ohne Wiederholung)
        let pool = getUnusedTerms(currentCategoryKey, currentClusterKey, currentDifficulty);

        if (pool.length === 0) {
            // Fallback auf andere Cluster derselben Kategorie & Schwierigkeit
            for (const cKey of clusterKeys) {
                const altPool = getUnusedTerms(currentCategoryKey, cKey, currentDifficulty);
                if (altPool.length > 0) {
                    currentClusterKey = cKey;
                    pool = altPool;
                    break;
                }
            }
        }

        if (pool.length === 0) {
            // Fallback auf alle Schwierigkeiten dieser Kategorie
            for (const cKey of clusterKeys) {
                const allDiffs = [
                    ...catObj.clusters[cKey].easy,
                    ...catObj.clusters[cKey].medium,
                    ...catObj.clusters[cKey].expert
                ].filter(t => !sessionUsedTerms.has(t));
                if (allDiffs.length > 0) {
                    currentClusterKey = cKey;
                    pool = allDiffs;
                    break;
                }
            }
        }

        if (pool.length === 0) {
            // Wenn wirklich alle Begriffe dieser Kategorie in der Sitzung gespielt wurden: Sitzungsspeicher für diese Kategorie freigeben
            clusterKeys.forEach(cKey => {
                [...catObj.clusters[cKey].easy, ...catObj.clusters[cKey].medium, ...catObj.clusters[cKey].expert]
                    .forEach(t => sessionUsedTerms.delete(t));
            });
            pool = getUnusedTerms(currentCategoryKey, currentClusterKey, currentDifficulty);
        }

        currentTargetDe = pool[Math.floor(Math.random() * pool.length)];
        sessionUsedTerms.add(currentTargetDe);

        const lang = document.getElementById("lang-select").value;

        try {
            const articleData = await fetchWikiArticle(currentTargetDe, lang, currentDifficulty);
            if (!articleData || !articleData.paragraphs || articleData.paragraphs.length === 0) {
                if (retryCount < 5) return loadNextRound(retryCount + 1);
                throw new Error("Kein Artikeltext gefunden");
            }

            currentDisplayTitle = articleData.title;
            paragraphs = articleData.paragraphs;

            // Prüfen, ob im ersten Hinweis mindestens 3 ungeschwärzte Wörter übrig bleiben
            const firstPreview = redactText(paragraphs[0], currentDisplayTitle);
            const visibleWordsCount = countVisibleWords(firstPreview);
            if (visibleWordsCount < 3 && paragraphs.length > 1) {
                revealedCount = 2;
                const secondPreview = redactText(paragraphs[0] + " " + paragraphs[1], currentDisplayTitle);
                if (countVisibleWords(secondPreview) < 3 && retryCount < 5) {
                    return loadNextRound(retryCount + 1);
                }
            } else if (visibleWordsCount < 3 && retryCount < 5) {
                return loadNextRound(retryCount + 1);
            }

            if (paragraphs.length <= revealedCount) {
                document.getElementById("hint-btn").classList.add("hidden");
            }

            renderWikiText(false);
            await setupAnswerArea(lang);
            roundActive = true;
            startTimer();
        } catch (err) {
            if (retryCount < 5) {
                return loadNextRound(retryCount + 1);
            }
            document.getElementById("wiki-text").innerHTML = "Wikipedia-Artikel konnte gerade nicht geladen werden. Bitte weiterklicken.";
            document.getElementById("hint-btn").classList.add("hidden");
            document.getElementById("next-round-btn").classList.remove("hidden");
        }
    }

    function getUnusedTerms(catKey, clusterKey, diff) {
        const list = DATABASE[catKey].clusters[clusterKey][diff] || [];
        return list.filter(term => !sessionUsedTerms.has(term));
    }

    function countVisibleWords(htmlText) {
        const withoutRedacted = htmlText.replace(/<span class="redacted">.*?<\/span>/g, " ");
        const plain = withoutRedacted.replace(/<[^>]+>/g, " ").replace(/[^a-zA-ZäöüÄÖÜßàéèêîôûç0-9\s]/g, " ");
        const words = plain.trim().split(/\s+/).filter(w => w.length >= 2);
        return words.length;
    }

    async function fetchWikiArticle(germanTitle, targetLang, difficulty) {
        let titleToFetch = germanTitle;

        if (targetLang !== "de") {
            const langLinkUrl = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&prop=langlinks&lllang=${targetLang}&redirects=1&format=json&origin=*`;
            const res = await fetch(langLinkUrl);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            if (pages[pageId] && pages[pageId].langlinks && pages[pageId].langlinks.length > 0) {
                titleToFetch = pages[pageId].langlinks[0]["*"];
            }
        }

        const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exintro=0&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
        const response = await fetch(apiUrl);
        const json = await response.json();
        const pages = json.query.pages;
        const page = pages[Object.keys(pages)[0]];

        if (!page || !page.extract) return null;

        let rawParagraphs = page.extract
            .split("
")
            .map(p => p.trim())
            .filter(p => p.length > 40 && !p.startsWith("=="));

        if (rawParagraphs.length === 0) return null;

        // Im Experten-Modus ersten Absatz überspringen, falls genug weitere Absätze vorhanden sind
        if (difficulty === "expert" && rawParagraphs.length >= 3) {
            rawParagraphs = rawParagraphs.slice(1);
        }

        // Ersten Absatz in einen kompakten Einstieg (erster Satz) und den Rest aufteilen
        const firstPara = rawParagraphs[0];
        const sentenceMatch = firstPara.match(/^.*?[.!?](?=\s+[A-ZÄÖÜ0-9„"«]|$)/);
        let structuredHints = [];

        if (sentenceMatch && sentenceMatch[0].length >= 25 && firstPara.length - sentenceMatch[0].length >= 35) {
            structuredHints.push(sentenceMatch[0].trim());
            structuredHints.push(firstPara.slice(sentenceMatch[0].length).trim());
            if (rawParagraphs.length > 1) structuredHints.push(rawParagraphs[1]);
        } else {
            structuredHints = rawParagraphs.slice(0, 3);
        }

        return {
            title: page.title,
            paragraphs: structuredHints.slice(0, 3)
        };
    }

    function redactText(text, title) {
        let result = text;

        // 1. Alle Klammerausdrücke (rund und eckig, inkl. verschachtelter Klammern) komplett schwärzen
        let prev;
        do {
            prev = result;
            result = result.replace(/\([^()]*\)/g, match => `<span class="redacted">${"█".repeat(Math.max(4, match.length))}</span>`);
            result = result.replace(/\[[^\[\]]*\]/g, match => `<span class="redacted">${"█".repeat(Math.max(4, match.length))}</span>`);
        } while (result !== prev);

        // 2. Gesuchten Titel und signifikante Wortbestandteile schwärzen
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
        const stopWords = new Set(["der", "die", "das", "von", "und", "den", "dem", "des", "ein", "eine", "the", "and", "of", "van", "del", "las", "los", "les"]);
        const words = cleanTitle.split(/[\s\-–]+/).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));

        // Zuerst außerhalb von HTML-Tags ersetzen
        result = replaceOutsideTags(result, escapeRegExp(cleanTitle), match => `<span class="redacted">${"█".repeat(match.length)}</span>`);

        words.forEach(word => {
            const pattern = `\b${escapeRegExp(word)}[a-zäöüßéèêàáâôûç]*`;
            result = replaceOutsideTags(result, pattern, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
        });

        return result;
    }

    function replaceOutsideTags(html, patternStr, replacer) {
        const parts = html.split(/(<[^>]+>)/g);
        const regex = new RegExp(patternStr, "gi");
        for (let i = 0; i < parts.length; i += 2) {
            parts[i] = parts[i].replace(regex, replacer);
        }
        return parts.join("");
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\]/g, '\$&');
    }

    function renderWikiText(revealAll) {
        const container = document.getElementById("wiki-text");
        const visibleParas = paragraphs.slice(0, revealedCount);
        container.innerHTML = visibleParas.map(p => {
            const content = revealAll ? escapeHtml(p) : redactText(p, currentDisplayTitle);
            return `<div class="wiki-paragraph">${content}</div>`;
        }).join("");
    }

    function revealNextHint() {
        if (!roundActive || revealedCount >= paragraphs.length) return;
        playSound('hint');
        revealedCount++;
        possiblePoints = Math.max(1, possiblePoints - 1);
        updatePointsBadge();
        renderWikiText(false);

        if (revealedCount >= paragraphs.length) {
            document.getElementById("hint-btn").disabled = true;
        }
    }

    function updatePointsBadge() {
        document.getElementById("points-badge").textContent = `${possiblePoints} Pkt.`;
    }

    async function setupAnswerArea(lang) {
        const mode = document.getElementById("input-mode").value;
        if (mode === "mc") {
            const mcArea = document.getElementById("mc-area");
            mcArea.classList.remove("hidden");
            mcArea.innerHTML = "Lade Auswahlmöglichkeiten...";

            const clusterObj = DATABASE[currentCategoryKey].clusters[currentClusterKey];
            // Bevorzugt Distraktoren aus demselben Schwierigkeitsgrad und Cluster
            let candidatePool = (clusterObj[currentDifficulty] || []).filter(item => item !== currentTargetDe);

            // Falls weniger als 3 vorhanden, aus anderen Schwierigkeiten desselben Clusters auffüllen
            if (candidatePool.length < 3) {
                const sameClusterAll = [
                    ...(clusterObj.easy || []),
                    ...(clusterObj.medium || []),
                    ...(clusterObj.expert || [])
                ].filter(item => item !== currentTargetDe && !candidatePool.includes(item));
                candidatePool = candidatePool.concat(sameClusterAll);
            }

            const distractorsDe = candidatePool.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [currentDisplayTitle];

            for (const d of distractorsDe) {
                if (lang === "de") {
                    options.push(d);
                } else {
                    try {
                        const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&prop=langlinks&lllang=${lang}&redirects=1&format=json&origin=*`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const p = j.query.pages[Object.keys(j.query.pages)[0]];
                        options.push(p && p.langlinks ? p.langlinks[0]["*"] : d);
                    } catch (e) {
                        options.push(d);
                    }
                }
            }

            options = options.sort(() => 0.5 - Math.random());
            mcArea.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mc-btn";
                btn.textContent = opt.replace(/\s*\(.*?\)\s*/g, "");
                btn.onclick = () => checkMultipleChoice(btn, opt);
                mcArea.appendChild(btn);
            });
        } else {
            const textArea = document.getElementById("text-area");
            const input = document.getElementById("guess-input");
            textArea.classList.remove("hidden");
            input.value = "";
            input.disabled = false;
            input.focus();
        }
    }

    function checkMultipleChoice(btnElement, selectedOption) {
        if (!roundActive) return;
        const isCorrect = selectedOption === currentDisplayTitle;

        document.querySelectorAll(".mc-btn").forEach(b => {
            b.disabled = true;
            if (b.textContent === currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "")) {
                b.classList.add("correct");
            }
        });

        if (isCorrect) {
            btnElement.classList.add("correct");
            endRound(true);
        } else {
            btnElement.classList.add("wrong");
            endRound(false);
        }
    }

    function submitTextGuess() {
        if (!roundActive) return;
        const guess = document.getElementById("guess-input").value.trim().toLowerCase();
        if (!guess) return;

        const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
        const targetParts = cleanTarget.split(/[\s\-]+/);
        const lastName = targetParts[targetParts.length - 1];

        const isCorrect = guess === cleanTarget || (lastName.length >= 4 && guess === lastName);

        document.getElementById("guess-input").disabled = true;
        endRound(isCorrect);
    }

    function startTimer() {
        const limit = parseInt(document.getElementById("timer-select").value, 10);
        const timerBadge = document.getElementById("timer-badge");

        if (limit === 0) {
            timerBadge.classList.add("hidden");
            return;
        }

        timerBadge.classList.remove("hidden", "urgent");
        timeLeft = limit;
        timerBadge.textContent = `⏱ ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 5 && timeLeft > 0) {
                timerBadge.classList.add("urgent");
                playSound('tick');
            } else if (timeLeft <= 10) {
                timerBadge.classList.add("urgent");
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endRound(false, true);
            }
        }, 1000);
    }

    function endRound(won, timeOut = false) {
        roundActive = false;
        clearInterval(timerInterval);
        renderWikiText(true);

        const currentPlayerIdx = activePlayerIndices[currentTurnPointer];
        const feedback = document.getElementById("feedback-box");
        feedback.classList.remove("hidden", "win", "lose");

        const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");

        if (won) {
            playSound('win');
            players[currentPlayerIdx].score += possiblePoints;
            feedback.classList.add("win");
            feedback.textContent = `🎉 Richtig! Gesucht war „${cleanTitle}“. +${possiblePoints} Punkt(e) für ${players[currentPlayerIdx].name}!`;
        } else {
            playSound('lose');
            feedback.classList.add("lose");
            feedback.textContent = timeOut
                ? `⏱ Zeit abgelaufen! Gesucht war „${cleanTitle}“. 0 Punkte.`
                : `❌ Leider falsch! Gesucht war „${cleanTitle}“. 0 Punkte.`;
        }

        updateScoreboard();
        document.getElementById("hint-btn").classList.add("hidden");
        document.getElementById("next-round-btn").classList.remove("hidden");
    }

    function nextTurn() {
        currentTurnPointer++;

        // Prüfen, ob alle aktiven Spieler ihre Runde beendet haben
        if (currentTurnPointer >= activePlayerIndices.length) {
            currentTurnPointer = 0;

            if (!isSuddenDeath) {
                currentRoundNumber++;
                if (currentRoundNumber > totalRoundsPerPlayer) {
                    checkGameEndOrSuddenDeath();
                    return;
                }
            } else {
                // Nach einer Stechen-Runde erneut Gleichstand prüfen
                checkGameEndOrSuddenDeath();
                return;
            }
        }

        loadNextRound();
    }

    function checkGameEndOrSuddenDeath() {
        // Höchstpunktzahl unter den bisher aktiven Spielern ermitteln
        let maxScore = -1;
        activePlayerIndices.forEach(idx => {
            if (players[idx].score > maxScore) maxScore = players[idx].score;
        });

        const topPlayerIndices = activePlayerIndices.filter(idx => players[idx].score === maxScore);

        // Falls Multiplayer und mindestens 2 Spieler punktgleich vorne liegen -> Stechen!
        if (players.length > 1 && topPlayerIndices.length > 1) {
            isSuddenDeath = true;
            activePlayerIndices = topPlayerIndices;
            currentTurnPointer = 0;
            document.getElementById("sudden-death-banner").classList.remove("hidden");
            loadNextRound();
            return;
        }

        showVictoryScreen();
    }

    function showVictoryScreen() {
        clearInterval(timerInterval);
        playSound('fanfare');

        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("victory-screen").classList.remove("hidden");

        const sorted = [...players].sort((a, b) => b.score - a.score);
        const podiumList = document.getElementById("podium-list");

        if (players.length === 1) {
            document.getElementById("victory-subtitle").textContent = `Du hast ${sorted[0].score} von maximal ${totalRoundsPerPlayer * 3} Punkten erreicht!`;
        } else {
            document.getElementById("victory-subtitle").textContent = `Herzlichen Glückwunsch an ${sorted[0].name}!`;
        }

        const medals = ["🥇", "🥈", "🥉"];
        podiumList.innerHTML = sorted.map((p, idx) => `
            <div class="podium-item ${idx === 0 ? 'first' : ''}">
                <span>${medals[idx] || (idx + 1) + "."} ${escapeHtml(p.name)}</span>
                <span>${p.score} Pkt.</span>
            </div>
        `).join("");
    }
</script>
