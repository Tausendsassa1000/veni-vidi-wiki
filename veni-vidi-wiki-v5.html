<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veni, vidi, wiki</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 760px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 25px; }
        
        header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 2rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 5px; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } }

        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: #fff; }
        select:focus, input:focus { outline: none; border-color: var(--primary); }

        .player-setup { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .player-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .player-tag button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0; font-size: 1rem; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-small { padding: 8px 14px; font-size: 0.9rem; width: auto; }

        .hidden { display: none !important; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 16px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }
        .badge-round { background: #e2e8f0; color: #0f172a; }
        .badge-points { background: #dbeafe; color: #1e40af; }
        .badge-timer { background: #fef3c7; color: #92400e; }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 20px; line-height: 1.65; font-size: 1.05rem; min-height: 120px; }
        .wiki-paragraph { margin-bottom: 12px; animation: fadeIn 0.4s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 4px; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 500px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

        .text-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }

        .feedback { padding: 15px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }

        .scoreboard { margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .score-card { background: #f1f5f9; padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }

        /* Siegerehrung */
        .gameover-box { text-align: center; padding: 20px 10px; }
        .trophy { font-size: 4rem; margin-bottom: 10px; }
        .podium-list { max-width: 450px; margin: 20px auto; text-align: left; }
        .podium-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 10px; background: #f1f5f9; margin-bottom: 10px; font-size: 1.05rem; }
        .podium-item.first { background: #fef3c7; border: 2px solid #f59e0b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Veni, vidi, <span>wiki</span></h1>
        <div class="subtitle">Errate den Wikipedia-Eintrag – je weniger Hinweise, desto mehr Punkte!</div>
    </header>

    <!-- STARTMENÜ -->
    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select">Sprache der Artikel</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch (Standard)</option>
                    <option value="en">Englisch</option>
                    <option value="fr">Französisch</option>
                    <option value="it">Italienisch</option>
                </select>
            </div>
            <div>
                <label for="category-select">Kategorie</label>
                <select id="category-select">
                    <option value="all" selected>🎲 Quer-durch (Alle Kategorien)</option>
                    <option value="people">👤 Persönlichkeiten</option>
                    <option value="places">🌍 Länder, Städte & Bauwerke</option>
                    <option value="nature">🦁 Tiere & Natur</option>
                    <option value="culture">🎬 Film, Musik & Kultur</option>
                    <option value="science">🔬 Wissenschaft & Erfindung</option>
                </select>
            </div>
            <div>
                <label for="input-mode">Rate-Modus</label>
                <select id="input-mode">
                    <option value="mc" selected>Multiple Choice (4 Auswahlmöglichkeiten)</option>
                    <option value="text">Freies Textfeld (Für Profis)</option>
                </select>
            </div>
            <div>
                <label for="timer-select">Timer pro Runde</label>
                <select id="timer-select">
                    <option value="30">30 Sekunden</option>
                    <option value="45" selected>45 Sekunden</option>
                    <option value="60">60 Sekunden</option>
                    <option value="0">Kein Timer</option>
                </select>
            </div>
            <div style="grid-column: 1 / -1;">
                <label for="rounds-input">Rundenlimit (Runden pro Spieler – Standard: 10)</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
        </div>

        <div class="player-setup">
            <label>Spieler (Solo = 1 Spieler, Multiplayer = mehrere Namen hinzufügen)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="Spielername eingeben..." maxlength="20" onkeypress="if(event.key==='Enter') addPlayer()">
                <button type="button" class="btn btn-small" onclick="addPlayer()">+ Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button class="btn" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- SPIELFELD -->
    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <div>Am Zug: <strong id="current-player-display">Spieler 1</strong> (<span id="category-badge">Quer-durch</span>)</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span class="badge badge-round" id="round-badge">Runde 1 / 10</span>
                <span class="badge badge-points" id="points-badge">Mögliche Punkte: 3</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text">
            Lade Wikipedia-Artikel...
        </div>

        <div id="feedback-box" class="feedback hidden"></div>

        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="Gesuchten Begriff eintippen..." onkeypress="if(event.key==='Enter') submitTextGuess()">
            <button class="btn btn-small" onclick="submitTextGuess()">Prüfen</button>
        </div>

        <div class="controls-row">
            <button id="hint-btn" class="btn btn-secondary btn-small" onclick="revealNextHint()">🔍 Weiteren Text zeigen (-1 Punkt)</button>
            <button id="next-round-btn" class="btn btn-small hidden" onclick="nextTurn()">Nächste Runde ➔</button>
            <button class="btn btn-secondary btn-small" onclick="backToMenu()">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <!-- SIEGEREHRUNG -->
    <div id="gameover-screen" class="gameover-box hidden">
        <div class="trophy">🏆</div>
        <h2 id="winner-headline">Spiel beendet!</h2>
        <p class="subtitle" id="winner-subline">Hier ist die finale Auswertung:</p>
        <div class="podium-list" id="final-podium"></div>
        <div style="display: flex; gap: 10px; max-width: 450px; margin: 20px auto 0;">
            <button class="btn" onclick="startGame()">Nochmals spielen</button>
            <button class="btn btn-secondary" onclick="backToMenu()">Zurück zum Menü</button>
        </div>
    </div>
</div>

<script>
    // Stark erweiterter, thematisch geclusterter Begriffs-Pool für knackigen Multiple-Choice-Modus
    const DATABASE = {
        people: [
            ["Albert Einstein", "Marie Curie", "Isaac Newton", "Nikola Tesla", "Galileo Galilei", "Stephen Hawking", "Charles Darwin", "Max Planck", "Werner Heisenberg", "Niels Bohr", "Johannes Kepler", "Thomas Alva Edison"],
            ["Leonardo da Vinci", "Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Pablo Picasso", "Frida Kahlo", "Vincent van Gogh", "Johann Sebastian Bach", "Rembrandt van Rijn", "Claude Monet", "Freddie Mercury", "Michael Jackson", "Elvis Presley"],
            ["Kleopatra VII.", "Julius Caesar", "Napoleon Bonaparte", "Nelson Mandela", "Jeanne d'Arc", "Winston Churchill", "Abraham Lincoln", "Mahatma Gandhi", "Alexander der Große", "Queen Victoria", "Karl der Große", "Elisabeth I."],
            ["Roger Federer", "Michael Schumacher", "Muhammad Ali", "Pelé", "Usain Bolt", "Serena Williams", "Diego Maradona", "Lionel Messi", "Michael Jordan", "Steffi Graf", "Ayrton Senna", "Simone Biles"],
            ["William Shakespeare", "Johann Wolfgang von Goethe", "Friedrich Schiller", "Astrid Lindgren", "J. R. R. Tolkien", "Agatha Christie", "Ernest Hemingway", "Franz Kafka", "Mark Twain", "Erich Kästner"]
        ],
        places: [
            ["Eiffelturm", "Kolosseum", "Pyramiden von Gizeh", "Taj Mahal", "Freiheitsstatue", "Chinesische Mauer", "Schiefer Turm von Pisa", "Akropolis (Athen)", "Brandenburger Tor", "Schloss Neuschwanstein", "Big Ben", "Sydney Opera House"],
            ["Mount Everest", "Matterhorn", "Kilimandscharo", "Mont Blanc", "Eiger", "Fuji (Vulkan)", "Zugspitze", "Vesuv", "Ätna", "Grossglockner", "Dufourspitze", "Popocatépetl"],
            ["Tokio", "Venedig", "New York City", "Paris", "London", "Rom", "Zürich", "Wien", "Berlin", "Barcelona", "Istanbul", "Kairo"],
            ["Schweiz", "Island", "Australien", "Japan", "Norwegen", "Brasilien", "Kanada", "Ägypten", "Neuseeland", "Peru", "Griechenland", "Mexiko"],
            ["Nil", "Amazonas", "Rhein", "Donau", "Bodensee", "Genfersee", "Sahara", "Grand Canyon", "Niagarafälle", "Antarktika"]
        ],
        nature: [
            ["Blauwal", "Gepard", "Eisbär", "Riesenpanda", "Löwe", "Tiger", "Elefanten", "Giraffe", "Schimpanse", "Wolf", "Koala", "Schneeleopard"],
            ["Kaiserpinguin", "Flamingo", "Wanderfalke", "Steinadler", "Kolibris", "Strauß (Vogel)", "Uhu", "Albatrosse", "Eisvogel", "Storch", "Kiwi (Vogel)", "Pelikan"],
            ["Komodowaran", "Chamäleons", "Krokodile", "Lederschildkröte", "Königskobra", "Galápagos-Riesenschildkröte", "Feuersalamander", "Anakondas", "Leguane", "Grüne Meeresschildkröte"],
            ["Sonnenblume", "Riesenmammutbaum", "Edelweiß", "Venusfliegenfalle", "Bambus", "Olivenbaum", "Orchideen", "Kakaobaum", "Affenbrotbäume", "Seerosen"],
            ["Honigbiene", "Monarchfalter", "Weißer Hai", "Kraken", "Seepferdchen", "Mantarochen", "Quallen", "Blattschneiderameisen", "Gottesanbeterin", "Kugelfische"]
        ],
        culture: [
            ["Titanic (1997)", "Star Wars", "Der Herr der Ringe (Filmtrilogie)", "Jurassic Park", "Pulp Fiction", "Der Pate", "Matrix (Film)", "Inception", "Forrest Gump", "Zurück in die Zukunft", "Casablanca (Film)", "Schindlers Liste"],
            ["Die Zauberflöte", "Mona Lisa", "Der Schrei", "Sternennacht", "Guernica (Bild)", "Das letzte Abendmahl (Leonardo da Vinci)", "Carmen", "Schwanensee", "Die vier Jahreszeiten (Vivaldi)", "Die Erschaffung Adams"],
            ["The Beatles", "Queen (Band)", "ABBA", "Pink Floyd", "The Rolling Stones", "Nirvana (Band)", "Led Zeppelin", "Depeche Mode", "U2", "Metallica"],
            ["Harry Potter", "Sherlock Holmes", "Don Quijote", "Der kleine Prinz", "Faust. Eine Tragödie", "Alice im Wunderland", "Pippi Langstrumpf", "1984 (Roman)", "Die Verwandlung", "Moby-Dick"],
            ["Olympische Spiele", "Schach", "Fußball-Weltmeisterschaft", "Tour de France", "Formel 1", "Nobelpreis", "Oscar", "Eurovision Song Contest", "Tetris", "Rubik’s Cube"]
        ],
        science: [
            ["Buchdruck", "Dampfmaschine", "Glühlampe", "Kompass", "Telefon", "Automobil", "Fernsehen", "Fotografie", "Flugzeug", "Kühlschrank"],
            ["Penicillin", "Röntgenstrahlung", "Desoxyribonukleinsäure", "Impfung", "Anästhesie", "Insulin", "Magnetresonanztomographie", "Bakterien", "Viren", "Blutkreislauf"],
            ["Internationale Raumstation", "Schwarzes Loch", "Apollo 11", "Hubble-Weltraumteleskop", "Sonnensystem", "Saturn (Planet)", "Mars (Planet)", "Milchstraße", "Urknall", "Sputnik 1"],
            ["Internet", "Künstliche Intelligenz", "World Wide Web", "Mikroprozessor", "Laser", "Radar", "GPS", "Kernspaltung", "Relativitätstheorie", "Quantenmechanik"]
        ]
    };

    let players = [{ name: "Spieler 1", score: 0 }];
    let currentPlayerIndex = 0;
    let currentRoundNumber = 1;
    let maxRounds = 10;
    let usedTerms = new Set();
    
    let currentTargetDe = "";
    let currentDisplayTitle = "";
    let currentCategoryKey = "";
    let currentCluster = [];
    let hints = [];
    let revealedCount = 1;
    let possiblePoints = 3;
    let roundActive = false;
    let timerInterval = null;
    let timeLeft = 45;

    renderPlayerTags();

    function addPlayer() {
        const input = document.getElementById("player-name-input");
        const name = input.value.trim();
        if (name && players.length < 8) {
            if (players.length === 1 && players[0].name === "Spieler 1" && usedTerms.size === 0) {
                players = [];
            }
            players.push({ name: name, score: 0 });
            input.value = "";
            renderPlayerTags();
        }
    }

    function removePlayer(index) {
        if (players.length > 1) {
            players.splice(index, 1);
            renderPlayerTags();
        }
    }

    function renderPlayerTags() {
        const container = document.getElementById("player-tags");
        container.innerHTML = players.map((p, idx) => `
            <div class="player-tag">
                <span>${p.name}</span>
                ${players.length > 1 ? `<button onclick="removePlayer(${idx})">×</button>` : ''}
            </div>
        `).join("");
    }

    function startGame() {
        const rInput = parseInt(document.getElementById("rounds-input").value);
        maxRounds = (isNaN(rInput) || rInput < 1) ? 10 : Math.min(100, rInput);
        
        players.forEach(p => p.score = 0);
        currentPlayerIndex = 0;
        currentRoundNumber = 1;
        usedTerms.clear();

        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("gameover-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        loadNextRound();
    }

    function backToMenu() {
        clearInterval(timerInterval);
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("gameover-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    }

    function updateScoreboard() {
        const list = document.getElementById("scoreboard-list");
        list.innerHTML = players.map((p, idx) => `
            <div class="score-card ${idx === currentPlayerIndex ? 'active' : ''}">
                ${p.name}: <strong>${p.score} Pkt.</strong>
            </div>
        `).join("");
    }

    async function loadNextRound(retryCount = 0) {
        clearInterval(timerInterval);
        roundActive = false;
        revealedCount = 1;
        possiblePoints = 3;

        document.getElementById("feedback-box").classList.add("hidden");
        document.getElementById("next-round-btn").classList.add("hidden");
        document.getElementById("hint-btn").classList.remove("hidden");
        document.getElementById("hint-btn").disabled = false;
        document.getElementById("wiki-text").innerHTML = "<em>Suche passenden Wikipedia-Eintrag...</em>";
        document.getElementById("mc-area").classList.add("hidden");
        document.getElementById("text-area").classList.add("hidden");

        document.getElementById("current-player-display").textContent = players[currentPlayerIndex].name;
        document.getElementById("round-badge").textContent = `Runde ${currentRoundNumber} / ${maxRounds}`;
        updatePointsBadge();
        updateScoreboard();

        const selectedCat = document.getElementById("category-select").value;
        const catKeys = Object.keys(DATABASE);
        currentCategoryKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;

        const catNames = { people: "Persönlichkeiten", places: "Orte & Bauwerke", nature: "Tiere & Natur", culture: "Kultur", science: "Wissenschaft" };
        document.getElementById("category-badge").textContent = catNames[currentCategoryKey];

        // Alle Begriffe der Kategorie sammeln, die noch nicht gespielt wurden
        const clusters = DATABASE[currentCategoryKey];
        let availableItems = [];
        clusters.forEach((cluster, cIdx) => {
            cluster.forEach(item => {
                if (!usedTerms.has(item)) {
                    availableItems.push({ term: item, clusterIndex: cIdx });
                }
            });
        });

        if (availableItems.length === 0) {
            usedTerms.clear();
            clusters.forEach((cluster, cIdx) => {
                cluster.forEach(item => availableItems.push({ term: item, clusterIndex: cIdx }));
            });
        }

        const chosen = availableItems[Math.floor(Math.random() * availableItems.length)];
        currentTargetDe = chosen.term;
        currentCluster = clusters[chosen.clusterIndex];
        usedTerms.add(currentTargetDe);

        const lang = document.getElementById("lang-select").value;

        try {
            const articleData = await fetchWikiArticle(currentTargetDe, lang);
            if (!articleData.hints || articleData.hints.length === 0) {
                if (retryCount < 4) return loadNextRound(retryCount + 1);
            }

            currentDisplayTitle = articleData.title;
            hints = articleData.hints;

            if (hints.length < 2) {
                document.getElementById("hint-btn").classList.add("hidden");
            }

            renderWikiText(false);
            await setupAnswerArea(lang);
            roundActive = true;
            startTimer();
        } catch (err) {
            if (retryCount < 4) return loadNextRound(retryCount + 1);
            document.getElementById("wiki-text").innerHTML = "Fehler beim Laden von Wikipedia. Bitte nächste Runde klicken.";
            document.getElementById("next-round-btn").classList.remove("hidden");
        }
    }

    async function fetchWikiArticle(germanTitle, targetLang) {
        let titleToFetch = germanTitle;

        if (targetLang !== "de") {
            const langLinkUrl = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&prop=langlinks&lllang=${targetLang}&redirects=1&format=json&origin=*`;
            const res = await fetch(langLinkUrl);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            if (pages[pageId].langlinks && pages[pageId].langlinks.length > 0) {
                titleToFetch = pages[pageId].langlinks[0]["*"];
            }
        }

        const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exintro=0&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
        const response = await fetch(apiUrl);
        const json = await response.json();
        const pages = json.query.pages;
        const page = pages[Object.keys(pages)[0]];

        if (!page || !page.extract) {
            return { title: titleToFetch, hints: [] };
        }

        const rawParagraphs = page.extract
            .split("\n")
            .map(p => p.trim())
            .filter(p => p.length > 35 && !p.startsWith("=="));

        if (rawParagraphs.length === 0) {
            return { title: page.title, hints: [] };
        }

        // Aufteilung in 3 Stufen: 1. Satz (kurz), Rest von Absatz 1, Absatz 2
        const firstPara = rawParagraphs[0];
        let step1 = "";
        let step2 = "";

        // Ersten sinnvollen Satz erkennen (Abkürzungen wie "ca.", "bzw.", "geb.", "Dr.", "St." ignorieren)
        const sentenceMatch = firstPara.match(/^(.{30,}?(?<!\bca|bzw|geb|gest|usw|etc|Nr|Dr|Prof|St|v|n|Chr|Mio|Mrd)\.[\s\)\]])(.*)$/s);
        if (sentenceMatch && sentenceMatch[2].trim().length > 25) {
            step1 = sentenceMatch[1].trim();
            step2 = sentenceMatch[2].trim();
        } else if (firstPara.length > 150) {
            const cutIdx = firstPara.indexOf(" ", 125);
            if (cutIdx !== -1) {
                step1 = firstPara.slice(0, cutIdx) + " …";
                step2 = "… " + firstPara.slice(cutIdx + 1);
            } else {
                step1 = firstPara;
            }
        } else {
            step1 = firstPara;
        }

        let builtHints = [step1];
        if (step2) builtHints.push(step2);
        if (rawParagraphs.length > 1) builtHints.push(rawParagraphs[1]);
        if (builtHints.length < 3 && rawParagraphs.length > 2) builtHints.push(rawParagraphs[2]);

        return {
            title: page.title,
            hints: builtHints.slice(0, 3)
        };
    }

    function redactText(text, title) {
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
        const words = cleanTitle.split(/[\s\-]+/).filter(w => w.length > 2 && !["der", "die", "das", "von", "und", "the", "für", "mit"].includes(w.toLowerCase()));
        
        let result = text;

        // 1. Lautschrift und Aussprache-Klammern komplett schwärzen (IPA-Zeichen, eckige Klammern in runden Klammern, Sprachhinweise)
        const ipaRegex = /[ˈˌːəʃʒθðŋɲɑɔɛɪʊʌæøœʏçχʁħʕʔ]/;
        const langHintRegex = /\b(IPA|Aussprache|englisch|französisch|italienisch|spanisch|lateinisch|altgriechisch|russisch|arabisch|japanisch|chinesisch|eigentlich|bürgerlich|kurz|anhören)\b/i;

        // Verschachtelte oder einfache runde Klammern am Artikelanfang prüfen
        result = result.replace(/\((?:[^()]+|\([^()]*\))*\)/g, (match) => {
            const hasBracket = /\[[^\]]+\]/.test(match);
            const hasIpa = ipaRegex.test(match);
            const hasLangHint = langHintRegex.test(match);
            const hasTitleWord = words.some(w => new RegExp(escapeRegExp(w), "i").test(match));

            if (hasBracket || hasIpa || hasLangHint || hasTitleWord) {
                return `<span class="redacted">${"█".repeat(Math.min(match.length, 24))}</span>`;
            }
            return match;
        });

        // Standalone Lautschrift in eckigen Klammern [ˈ...] oder Schrägstrichen /ˈ.../
        result = result.replace(/\[[^\]]*[ˈˌːəʃʒθðŋɑɔɛɪʊʌæøœ][^\]]*\]/g, m => `<span class="redacted">${"█".repeat(Math.min(m.length, 16))}</span>`);
        result = result.replace(/\/[^\/\s]*[ˈˌːəʃʒθðŋɑɔɛɪʊʌæøœ][^\/\s]*\//g, m => `<span class="redacted">${"█".repeat(Math.min(m.length, 16))}</span>`);

        // 2. Kompletten Titel schwärzen
        const fullRegex = new RegExp(escapeRegExp(cleanTitle), "gi");
        result = result.replace(fullRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);

        // 3. Einzelne signifikante Namensbestandteile schwärzen (HTML-Tags dabei aussparen)
        words.forEach(word => {
            const wordRegex = new RegExp(`(?![^<]*>)\\b${escapeRegExp(word)}[a-zäöüß]*`, "gi");
            result = result.replace(wordRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
        });

        return result;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderWikiText(revealAll) {
        const container = document.getElementById("wiki-text");
        const visibleHints = hints.slice(0, revealedCount);
        container.innerHTML = visibleHints.map(h => {
            const content = revealAll ? h : redactText(h, currentDisplayTitle);
            return `<div class="wiki-paragraph">${content}</div>`;
        }).join("");
    }

    function revealNextHint() {
        if (!roundActive || revealedCount >= hints.length) return;
        revealedCount++;
        possiblePoints = Math.max(1, 4 - revealedCount);
        updatePointsBadge();
        renderWikiText(false);

        if (revealedCount >= hints.length) {
            document.getElementById("hint-btn").disabled = true;
        }
    }

    function updatePointsBadge() {
        document.getElementById("points-badge").textContent = `Mögliche Punkte: ${possiblePoints}`;
    }

    async function setupAnswerArea(lang) {
        const mode = document.getElementById("input-mode").value;
        if (mode === "mc") {
            const mcArea = document.getElementById("mc-area");
            mcArea.classList.remove("hidden");
            mcArea.innerHTML = "Lade Antwortmöglichkeiten...";

            // 3 falsche Optionen aus exakt derselben Untergruppe wählen
            const distractorsDe = currentCluster
                .filter(item => item !== currentTargetDe)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            let options = [currentDisplayTitle];
            for (const d of distractorsDe) {
                if (lang === "de") {
                    options.push(d);
                } else {
                    const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&prop=langlinks&lllang=${lang}&redirects=1&format=json&origin=*`;
                    const r = await fetch(url);
                    const j = await r.json();
                    const p = j.query.pages[Object.keys(j.query.pages)[0]];
                    options.push(p.langlinks ? p.langlinks[0]["*"] : d);
                }
            }

            options = options.sort(() => 0.5 - Math.random());
            mcArea.innerHTML = options.map(opt => {
                const cleanOpt = opt.replace(/\s*\(.*?\)\s*/g, "");
                return `<button class="mc-btn" onclick="checkMultipleChoice(this, '${opt.replace(/'/g, "\\'")}')">${cleanOpt}</button>`;
            }).join("");
        } else {
            const textArea = document.getElementById("text-area");
            const input = document.getElementById("guess-input");
            textArea.classList.remove("hidden");
            input.value = "";
            input.disabled = false;
            input.focus();
        }
    }

    function checkMultipleChoice(btnElement, selectedOption) {
        if (!roundActive) return;
        const isCorrect = selectedOption === currentDisplayTitle;
        
        document.querySelectorAll(".mc-btn").forEach(b => {
            b.disabled = true;
            if (b.getAttribute("onclick").includes(`'${currentDisplayTitle.replace(/'/g, "\\'")}'`)) {
                b.classList.add("correct");
            }
        });

        if (isCorrect) {
            btnElement.classList.add("correct");
            endRound(true);
        } else {
            btnElement.classList.add("wrong");
            endRound(false);
        }
    }

    function submitTextGuess() {
        if (!roundActive) return;
        const guess = document.getElementById("guess-input").value.trim().toLowerCase();
        if (!guess) return;

        const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
        const targetParts = cleanTarget.split(" ");
        const lastName = targetParts[targetParts.length - 1];

        const isCorrect = guess === cleanTarget || (lastName.length >= 4 && guess === lastName);

        document.getElementById("guess-input").disabled = true;
        endRound(isCorrect);
    }

    function startTimer() {
        const limit = parseInt(document.getElementById("timer-select").value);
        const timerBadge = document.getElementById("timer-badge");
        
        if (limit === 0) {
            timerBadge.classList.add("hidden");
            return;
        }

        timerBadge.classList.remove("hidden", "urgent");
        timeLeft = limit;
        timerBadge.textContent = `⏱ ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 10) timerBadge.classList.add("urgent");

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endRound(false, true);
            }
        }, 1000);
    }

    function endRound(won, timeOut = false) {
        roundActive = false;
        clearInterval(timerInterval);
        renderWikiText(true);

        const feedback = document.getElementById("feedback-box");
        feedback.classList.remove("hidden", "win", "lose");

        const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");

        if (won) {
            players[currentPlayerIndex].score += possiblePoints;
            feedback.classList.add("win");
            feedback.textContent = `🎉 Richtig! Gesucht war „${cleanTitle}“. +${possiblePoints} Punkt(e) für ${players[currentPlayerIndex].name}!`;
        } else {
            feedback.classList.add("lose");
            feedback.textContent = timeOut 
                ? `⏱ Zeit abgelaufen! Gesucht war „${cleanTitle}“. 0 Punkte.`
                : `❌ Leider falsch! Gesucht war „${cleanTitle}“. 0 Punkte.`;
        }

        updateScoreboard();
        document.getElementById("hint-btn").classList.add("hidden");

        const isLastTurnOfGame = (currentPlayerIndex === players.length - 1) && (currentRoundNumber >= maxRounds);
        const nextBtn = document.getElementById("next-round-btn");
        nextBtn.textContent = isLastTurnOfGame ? "Zur Siegerehrung 🏆" : "Nächste Runde ➔";
        nextBtn.classList.remove("hidden");
    }

    function nextTurn() {
        if (currentPlayerIndex === players.length - 1) {
            if (currentRoundNumber >= maxRounds) {
                showGameOver();
                return;
            }
            currentRoundNumber++;
            currentPlayerIndex = 0;
        } else {
            currentPlayerIndex++;
        }
        loadNextRound();
    }

    function showGameOver() {
        clearInterval(timerInterval);
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("gameover-screen").classList.remove("hidden");

        const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
        const topScore = sortedPlayers[0].score;
        const winners = sortedPlayers.filter(p => p.score === topScore);

        const headline = document.getElementById("winner-headline");
        const subline = document.getElementById("winner-subline");

        if (players.length === 1) {
            headline.textContent = `Geschafft, ${players[0].name}!`;
            subline.textContent = `Du hast in ${maxRounds} Runden insgesamt ${topScore} von ${maxRounds * 3} möglichen Punkten erreicht.`;
        } else if (winners.length === 1) {
            headline.textContent = `${winners[0].name} gewinnt!`;
            subline.textContent = `Sieg mit ${topScore} Punkten nach ${maxRounds} Runden.`;
        } else {
            headline.textContent = `Unentschieden!`;
            subline.textContent = `${winners.map(w => w.name).join(" & ")} teilen sich Platz 1 mit ${topScore} Punkten.`;
        }

        const podium = document.getElementById("final-podium");
        podium.innerHTML = sortedPlayers.map((p, idx) => {
            const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}.`;
            return `
                <div class="podium-item ${idx === 0 ? 'first' : ''}">
                    <span>${medal} ${p.name}</span>
                    <strong>${p.score} Punkte</strong>
                </div>
            `;
        }).join("");
    }
</script>
