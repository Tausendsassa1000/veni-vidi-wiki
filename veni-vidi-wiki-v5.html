<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veni, vidi, wiki</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; }
        .container { max-width: 780px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 22px; position: relative; }
        
        header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; position: relative; }
        h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }

        .sound-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: 0.15s;
        }
        .sound-toggle:hover { background: #e2e8f0; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        @media (max-width: 600px) {
            .setup-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.65rem; padding-right: 75px; text-align: left; }
            .subtitle { text-align: left; }
        }

        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.98rem; background: #fff; }
        select:focus, input:focus { outline: none; border-color: var(--primary); }

        .player-setup { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .player-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .player-tag button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0; font-size: 1.1rem; line-height: 1; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-small { padding: 9px 14px; font-size: 0.92rem; width: auto; }

        .hidden { display: none !important; }

        /* Fixierte Status-Leiste für Handy & Desktop */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            gap: 8px;
        }
        .status-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .player-turn {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .round-meta {
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .badge {
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        .badge-points { background: #dbeafe; color: #1e40af; }
        .badge-timer {
            background: #fef3c7;
            color: #92400e;
            min-width: 76px;
            display: inline-block;
        }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }

        @media (max-width: 480px) {
            .container { padding: 14px; }
            .status-bar { padding: 8px 10px; gap: 6px; }
            .badge { font-size: 0.78rem; padding: 4px 6px; }
            .badge-timer { min-width: 68px; }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .tiebreaker-banner {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 1.5px solid #f59e0b;
            color: #92400e;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.65; font-size: 1.02rem; min-height: 120px; }
        .wiki-paragraph { margin-bottom: 12px; animation: fadeIn 0.35s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 3px; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 520px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 12px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

        .text-input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

        .feedback { padding: 14px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }

        .scoreboard { margin-top: 18px; border-top: 2px solid #e2e8f0; padding-top: 14px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .score-card { background: #f1f5f9; padding: 7px 12px; border-radius: 8px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }

        /* Siegerehrung */
        .podium-box { text-align: center; padding: 10px 0; }
        .podium-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 16px; }
        .podium-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .podium-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 12px 16px; border-radius: 10px; font-size: 1.05rem; }
        .podium-item.first { background: #fef9c3; border-color: #eab308; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Veni, vidi, <span>wiki</span></h1>
        <div class="subtitle">Errate den Wikipedia-Eintrag – je weniger Hinweise, desto mehr Punkte!</div>
        <button type="button" class="sound-toggle" id="sound-toggle-btn" onclick="toggleSound()">🔊 Ton an</button>
    </header>

    <!-- STARTMENÜ -->
    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select">Sprache der Artikel</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch (Standard)</option>
                    <option value="en">Englisch</option>
                    <option value="fr">Französisch</option>
                    <option value="it">Italienisch</option>
                </select>
            </div>
            <div>
                <label for="category-select">Kategorie</label>
                <select id="category-select">
                    <option value="all" selected>🎲 Quer-durch (Alle Kategorien)</option>
                    <option value="people">👤 Persönlichkeiten</option>
                    <option value="places">🌍 Länder, Städte & Bauwerke</option>
                    <option value="nature">🦁 Tiere & Natur</option>
                    <option value="culture">🎬 Film, Musik & Kultur</option>
                    <option value="science">🔬 Wissenschaft & Erfindung</option>
                    <option value="sport">⚽ Sport</option>
                    <option value="food">🍽️ Essen & Trinken</option>
                </select>
            </div>
            <div>
                <label for="difficulty-select">Schwierigkeitsgrad</label>
                <select id="difficulty-select">
                    <option value="easy">🟢 Leicht</option>
                    <option value="medium" selected>🟡 Mittel</option>
                    <option value="hard">🔴 Experte</option>
                </select>
            </div>
            <div>
                <label for="input-mode">Rate-Modus</label>
                <select id="input-mode">
                    <option value="mc" selected>Multiple Choice (4 Auswahlmöglichkeiten)</option>
                    <option value="text">Freies Textfeld (Für Profis)</option>
                </select>
            </div>
            <div>
                <label for="rounds-input">Runden pro Spieler</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
            <div>
                <label for="timer-select">Timer pro Runde</label>
                <select id="timer-select">
                    <option value="30">30 Sekunden</option>
                    <option value="45" selected>45 Sekunden</option>
                    <option value="60">60 Sekunden</option>
                    <option value="0">Kein Timer</option>
                </select>
            </div>
        </div>

        <div class="player-setup">
            <label>Spieler (Solo = 1 Spieler, Multiplayer = mehrere Namen hinzufügen)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="Spielername eingeben..." maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault(); addPlayer();}">
                <button type="button" class="btn btn-small" onclick="addPlayer()">+ Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button type="button" class="btn" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- SPIELFELD -->
    <div id="game-screen" class="hidden">
        <div id="tiebreaker-banner" class="tiebreaker-banner hidden">⚡ STECHEN! Punktgleichstand an der Spitze – Entscheidungsrunde!</div>

        <div class="status-bar">
            <div class="status-left">
                <div class="player-turn">Am Zug: <strong id="current-player-display">Spieler 1</strong></div>
                <div class="round-meta"><span id="round-display">Runde 1 / 10</span> · <span id="category-badge">Quer-durch</span></div>
            </div>
            <div class="status-badges">
                <span class="badge badge-points" id="points-badge">3 Pkt.</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text">
            Lade Wikipedia-Artikel...
        </div>

        <div id="feedback-box" class="feedback hidden"></div>

        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="Gesuchten Begriff eintippen..." onkeydown="if(event.key==='Enter'){event.preventDefault(); submitTextGuess();}">
            <button type="button" class="btn btn-small" onclick="submitTextGuess()">Prüfen</button>
        </div>

        <div class="controls-row">
            <button type="button" id="hint-btn" class="btn btn-secondary btn-small" onclick="revealNextHint()">🔍 Weiteren Text (-1 Pkt.)</button>
            <button type="button" id="next-round-btn" class="btn btn-small hidden" onclick="nextTurn()">Nächste Runde ➔</button>
            <button type="button" class="btn btn-secondary btn-small" onclick="backToMenu()">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <!-- SIEGEREHRUNG -->
    <div id="end-screen" class="hidden">
        <div class="podium-box">
            <div class="podium-title">🏆 Spielende & Ergebnis</div>
            <div class="podium-list" id="podium-list"></div>
            <button type="button" class="btn" onclick="backToMenu()">Neues Spiel starten</button>
        </div>
    </div>
</div>

<script>
    // Sound Engine (Web Audio API - komplett ohne externe Dateien)
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioCtx() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById("sound-toggle-btn").textContent = soundEnabled ? "🔊 Ton an" : "🔇 Ton aus";
    }

    function playTone(freq, type, duration, delay = 0, vol = 0.12) {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
    }

    function playSound(effect) {
        if (!soundEnabled) return;
        if (effect === "win") {
            playTone(523.25, "triangle", 0.15, 0, 0.15);
            playTone(659.25, "triangle", 0.15, 0.1, 0.15);
            playTone(783.99, "triangle", 0.3, 0.2, 0.18);
        } else if (effect === "lose") {
            playTone(311.13, "sawtooth", 0.2, 0, 0.1);
            playTone(233.08, "sawtooth", 0.35, 0.16, 0.1);
        } else if (effect === "hint") {
            playTone(440, "sine", 0.12, 0, 0.08);
        } else if (effect === "tick") {
            playTone(880, "sine", 0.05, 0, 0.05);
        } else if (effect === "fanfare") {
            playTone(523.25, "triangle", 0.14, 0, 0.16);
            playTone(659.25, "triangle", 0.14, 0.12, 0.16);
            playTone(783.99, "triangle", 0.14, 0.24, 0.16);
            playTone(1046.5, "triangle", 0.45, 0.36, 0.2);
        }
    }

    function addPlayer() {

            alert("Maximal 8 Spieler möglich.");

        players.push({ name: name, score: 0 });

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    function pickCandidateTerm(selectedCat, difficulty) {
        const catKeys = Object.keys(DATABASE);
        const chosenCat = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;
        const clusters = Object.keys(DATABASE[chosenCat]);
        const chosenCluster = clusters[Math.floor(Math.random() * clusters.length)];

        let pool = DATABASE[chosenCat][chosenCluster][difficulty].filter(t => !sessionUsedTerms.has(t));

        // Falls in diesem Cluster & Schwierigkeitsgrad alles gespielt wurde, andere Schwierigkeit im selben Cluster prüfen
        if (pool.length === 0) {
            const allInCluster = [
                ...DATABASE[chosenCat][chosenCluster].easy,
                ...DATABASE[chosenCat][chosenCluster].medium,
                ...DATABASE[chosenCat][chosenCluster].hard
            ].filter(t => !sessionUsedTerms.has(t));
            pool = allInCluster;
        }

        // Falls ganze Kategorie durchgespielt wurde, alle ungespielten Begriffe der Kategorie sammeln
        if (pool.length === 0) {
            for (const c of clusters) {
                for (const d of ["easy", "medium", "hard"]) {
                    DATABASE[chosenCat][c][d].forEach(t => {
                        if (!sessionUsedTerms.has(t)) pool.push(t);
                    });
                }
            }
        }

        // Erst wenn wirklich alle 700+ Begriffe der Sitzung aufgebraucht sind, Reset
        if (pool.length === 0) {
            sessionUsedTerms.clear();
            pool = DATABASE[chosenCat][chosenCluster][difficulty];
        }

        const term = pool[Math.floor(Math.random() * pool.length)];
        return { term, catKey: chosenCat, clusterKey: chosenCluster };
    }

    async function loadNextRound(retryCount = 0) {
        clearInterval(timerInterval);
        roundActive = false;
        revealedCount = 1;
        possiblePoints = 3;

        document.getElementById("feedback-box").classList.add("hidden");
        document.getElementById("next-round-btn").classList.add("hidden");
        document.getElementById("hint-btn").classList.remove("hidden");
        document.getElementById("hint-btn").disabled = false;
        document.getElementById("wiki-text").innerHTML = "<em>Suche passenden Wikipedia-Eintrag...</em>";
        document.getElementById("mc-area").classList.add("hidden");
        document.getElementById("text-area").classList.add("hidden");

        document.getElementById("current-player-display").textContent = players[currentPlayerIndex].name;
        document.getElementById("round-display").textContent = isTiebreaker
            ? "Stechen"
            : `Runde ${currentRoundNumber} / ${totalRoundsPerPlayer}`;

        updatePointsBadge();
        updateScoreboard();

        const selectedCat = document.getElementById("category-select").value;
        const difficulty = document.getElementById("difficulty-select").value;
        const candidate = pickCandidateTerm(selectedCat, difficulty);

        currentCategoryKey = candidate.catKey;
        currentClusterKey = candidate.clusterKey;
        currentTargetDe = candidate.term;
        sessionUsedTerms.add(currentTargetDe);

        const catNames = {
            people: "Persönlichkeiten",
            places: "Orte & Bauwerke",
            nature: "Tiere & Natur",
            culture: "Kultur",
            science: "Wissenschaft",
            sport: "Sport",
            food: "Essen & Trinken"
        };
        document.getElementById("category-badge").textContent = catNames[currentCategoryKey];

        const lang = document.getElementById("lang-select").value;

        try {
            const articleData = await fetchWikiArticle(currentTargetDe, lang, difficulty);
            if (!articleData || articleData.paragraphs.length === 0) {
                if (retryCount < 5) return loadNextRound(retryCount + 1);
                throw new Error("Kein Artikeltext gefunden");
            }

            currentDisplayTitle = articleData.title;
            paragraphs = articleData.paragraphs;

            // Prüfen, ob im ersten Hinweis mindestens 3 ungeschwärzte Wörter sichtbar bleiben
            const firstHintRedacted = redactText(paragraphs, currentDisplayTitle);
            const plainVisible = firstHintRedacted.replace(/<[^>]*>/g, "").replace(/█+/g, "").trim();
            const visibleWords = plainVisible.split(/\s+/).filter(w => w.replace(/[^a-zA-ZäöüÄÖÜß0-9]/g, "").length >= 2);

            if (visibleWords.length < 3 && paragraphs.length > 1) {
                // Zweiten Block direkt mit dazunehmen, ohne Punktabzug
                paragraphs = [paragraphs + " " + paragraphs, ...paragraphs.slice(2)];
            }

            if (paragraphs.length < 2) {
                document.getElementById("hint-btn").classList.add("hidden");
            }

            renderWikiText(false);
            await setupAnswerArea(lang, difficulty);
            roundActive = true;
            startTimer();
        } catch (err) {
            if (retryCount < 5) {
                return loadNextRound(retryCount + 1);
            }
            document.getElementById("wiki-text").innerHTML = "Fehler beim Laden von Wikipedia. Bitte nächste Runde klicken.";
            document.getElementById("next-round-btn").classList.remove("hidden");
        }
    }

    async function fetchWikiArticle(germanTitle, targetLang, difficulty) {
        let titleToFetch = germanTitle;

        if (targetLang !== "de") {
            const langLinkUrl = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&prop=langlinks&lllang=${targetLang}&redirects=1&format=json&origin=*`;
            const res = await fetch(langLinkUrl);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages);
            if (pages[pageId].langlinks && pages[pageId].langlinks.length > 0) {
                titleToFetch = pages[pageId].langlinks["*"];
            }
        }

        const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exintro=0&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
        const response = await fetch(apiUrl);
        const json = await response.json();
        const pages = json.query.pages;
        const pageId = Object.keys(pages);
        if (pageId === "-1" || !pages[pageId].extract) return null;

        const page = pages[pageId];
        const rawParagraphs = page.extract
            .split("
")
            .map(p => p.trim())
            .filter(p => p.length > 40 && !p.startsWith("=="));

        if (rawParagraphs.length === 0) return null;

        // Im Expertenmodus den allerersten Einleitungssatz überspringen, falls genug Text vorhanden ist
        let usableParagraphs = rawParagraphs;
        if (difficulty === "hard" && rawParagraphs.length >= 2) {
            usableParagraphs = rawParagraphs.slice(1);
        }

        // Ersten Absatz in einen kompakten ersten Hinweis und den Rest aufteilen
        const firstPara = usableParagraphs;
        const sentenceMatch = firstPara.match(/^(.{45,170}?[.!?])\s+(.*)$/);
        let structuredHints = [];

        if (sentenceMatch) {
            structuredHints.push(sentenceMatch);
            structuredHints.push(sentenceMatch);
            if (usableParagraphs.length > 1) {
                structuredHints.push(usableParagraphs);
            }
        } else {
            structuredHints = usableParagraphs.slice(0, 3);
        }

        return {
            title: page.title,
            paragraphs: structuredHints.slice(0, 3)
        };
    }

    function redactText(text, title) {
        let result = text;

        // 1. Alle verschachtelten und einfachen runden sowie eckigen Klammern komplett schwärzen (inkl. Lautschrift & "auch als ... bekannt")
        let prev;
        do {
            prev = result;
            result = result.replace(/\([^()]*\)/g, match => `<span class="redacted">${"█".repeat(Math.max(4, match.length))}</span>`);
            result = result.replace(/\[[^\[\]]*\]/g, match => `<span class="redacted">${"█".repeat(Math.max(4, match.length))}</span>`);
        } while (result !== prev);

        // Schrägstrich-Lautschriften wie /.../ schwärzen
        result = result.replace(/\/[^\/\s<>]{3,35}\//g, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);

        // 2. Gesuchten Titel und Namensbestandteile schwärzen (ohne HTML-Tags zu zerstören)
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
        const stopWords = new Set(["der", "die", "das", "den", "dem", "des", "von", "vom", "und", "the", "and", "of", "in", "im", "am", "an", "zu", "zum", "zur", "für", "mit", "auf", "bei", "aus", "ein", "eine", "einer", "eines", "sport", "film", "band", "berg", "käse", "vogel", "roman", "oper", "bild", "stadt"]);
        const words = cleanTitle
            .split(/[\s\-–]+/)
            .filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));

        // Text in HTML-Tags und normalen Text splitten, damit nur Text geschwärzt wird
        const parts = result.split(/(<[^>]+>)/g);
        for (let i = 0; i < parts.length; i++) {
            if (parts[i].startsWith("<")) continue;

            const fullRegex = new RegExp(escapeRegExp(cleanTitle), "gi");
            parts[i] = parts[i].replace(fullRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);

            words.forEach(word => {
                const wordRegex = new RegExp(`\b${escapeRegExp(word)}[a-zäöüß]*`, "gi");
                parts[i] = parts[i].replace(wordRegex, match => `<span class="redacted">${"█".repeat(match.length)}</span>`);
            });
        }

        return parts.join("");
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\]/g, '\$&');
    }

    function renderWikiText(revealAll) {
        const container = document.getElementById("wiki-text");
        const visibleParas = paragraphs.slice(0, revealedCount);
        container.innerHTML = visibleParas.map(p => {
            const content = revealAll ? escapeHtml(p) : redactText(p, currentDisplayTitle);
            return `<div class="wiki-paragraph">${content}</div>`;
        }).join("");
    }

    function revealNextHint() {
        if (!roundActive || revealedCount >= paragraphs.length) return;
        playSound("hint");
        revealedCount++;
        possiblePoints = Math.max(1, 4 - revealedCount);
        updatePointsBadge();
        renderWikiText(false);

        if (revealedCount >= paragraphs.length) {
            document.getElementById("hint-btn").disabled = true;
        }
    }

    function updatePointsBadge() {
        document.getElementById("points-badge").textContent = `${possiblePoints} Pkt.`;
    }

    async function setupAnswerArea(lang, difficulty) {
        const mode = document.getElementById("input-mode").value;
        if (mode === "mc") {
            const mcArea = document.getElementById("mc-area");
            mcArea.classList.remove("hidden");
            mcArea.innerHTML = "Lade Antwortmöglichkeiten...";

            // Falsche Antworten bevorzugt aus demselben Cluster & Schwierigkeitsgrad ziehen
            const clusterObj = DATABASE[currentCategoryKey][currentClusterKey];
            let distractorPool = clusterObj[difficulty].filter(item => item !== currentTargetDe);

            if (distractorPool.length < 3) {
                const fullCluster = [...clusterObj.easy, ...clusterObj.medium, ...clusterObj.hard]
                    .filter(item => item !== currentTargetDe);
                distractorPool = Array.from(new Set([...distractorPool, ...fullCluster]));
            }

            const distractorsDe = distractorPool.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [currentDisplayTitle];

            for (const d of distractorsDe) {
                if (lang === "de") {
                    options.push(d);
                } else {
                    try {
                        const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&prop=langlinks&lllang=${lang}&redirects=1&format=json&origin=*`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const p = j.query.pages[Object.keys(j.query.pages)];
                        options.push(p.langlinks ? p.langlinks["*"] : d);
                    } catch (e) {
                        options.push(d);
                    }
                }
            }

            options = options.sort(() => 0.5 - Math.random());
            mcArea.innerHTML = "";
            options.forEach(opt => {
                const cleanOpt = opt.replace(/\s*\(.*?\)\s*/g, "");
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mc-btn";
                btn.textContent = cleanOpt;
                btn.onclick = () => checkMultipleChoice(btn, opt);
                mcArea.appendChild(btn);
            });
        } else {
            const textArea = document.getElementById("text-area");
            const input = document.getElementById("guess-input");
            textArea.classList.remove("hidden");
            input.value = "";
            input.disabled = false;
            input.focus();
        }
    }

    function checkMultipleChoice(btnElement, selectedOption) {
        if (!roundActive) return;
        const isCorrect = selectedOption === currentDisplayTitle;

        document.querySelectorAll(".mc-btn").forEach(b => {
            b.disabled = true;
            if (b.textContent === currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "")) {
                b.classList.add("correct");
            }
        });

        if (isCorrect) {
            btnElement.classList.add("correct");
            endRound(true);
        } else {
            btnElement.classList.add("wrong");
            endRound(false);
        }
    }

    function submitTextGuess() {
        if (!roundActive) return;
        const guess = document.getElementById("guess-input").value.trim().toLowerCase();
        if (!guess) return;

        const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
        const targetParts = cleanTarget.split(/[\s\-]+/);
        const lastName = targetParts[targetParts.length - 1];

        const isCorrect = guess === cleanTarget || (lastName.length >= 4 && guess === lastName);

        document.getElementById("guess-input").disabled = true;
        endRound(isCorrect);
    }

    function startTimer() {
        const limit = parseInt(document.getElementById("timer-select").value);
        const timerBadge = document.getElementById("timer-badge");

        if (limit === 0) {
            timerBadge.classList.add("hidden");
            return;
        }

        timerBadge.classList.remove("hidden", "urgent");
        timeLeft = limit;
        timerBadge.textContent = `⏱ ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 10) timerBadge.classList.add("urgent");
            if (timeLeft <= 5 && timeLeft > 0) playSound("tick");

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endRound(false, true);
            }
        }, 1000);
    }

    function endRound(won, timeOut = false) {
        roundActive = false;
        clearInterval(timerInterval);
        renderWikiText(true);

        const feedback = document.getElementById("feedback-box");
        feedback.classList.remove("hidden", "win", "lose");

        const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");

        if (won) {
            playSound("win");
            players[currentPlayerIndex].score += possiblePoints;
            feedback.classList.add("win");
            feedback.textContent = `🎉 Richtig! Gesucht war „${cleanTitle}“. +${possiblePoints} Punkt(e) für ${players[currentPlayerIndex].name}!`;
        } else {
            playSound("lose");
            feedback.classList.add("lose");
            feedback.textContent = timeOut
                ? `⏱ Zeit abgelaufen! Gesucht war „${cleanTitle}“. 0 Punkte.`
                : `❌ Leider falsch! Gesucht war „${cleanTitle}“. 0 Punkte.`;
        }

        updateScoreboard();
        document.getElementById("hint-btn").classList.add("hidden");
        document.getElementById("next-round-btn").classList.remove("hidden");
    }

    function nextTurn() {
        const posInActive = activePlayerIndices.indexOf(currentPlayerIndex);

        if (posInActive + 1 < activePlayerIndices.length) {
            currentPlayerIndex = activePlayerIndices[posInActive + 1];
            loadNextRound();
            return;
        }

        // Alle aktiven Spieler waren in dieser Runde dran
        if (!isTiebreaker && currentRoundNumber < totalRoundsPerPlayer) {
            currentRoundNumber++;
            currentPlayerIndex = activePlayerIndices;
            loadNextRound();
            return;
        }

        // Prüfen, ob im Multiplayer Gleichstand auf Platz 1 herrscht
        if (players.length > 1) {
            const maxScore = Math.max(...activePlayerIndices.map(idx => players[idx].score));
            const leaders = activePlayerIndices.filter(idx => players[idx].score === maxScore);

            if (leaders.length > 1) {
                isTiebreaker = true;
                activePlayerIndices = leaders;
                currentPlayerIndex = activePlayerIndices;
                document.getElementById("tiebreaker-banner").classList.remove("hidden");
                loadNextRound();
                return;
            }
        }

        showPodium();
    }

    function showPodium() {
        clearInterval(timerInterval);
        playSound("fanfare");
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");

        const sorted = [...players].sort((a, b) => b.score - a.score);
        const medals = ["🥇", "🥈", "🥉"];
        const podiumList = document.getElementById("podium-list");

        podiumList.innerHTML = sorted.map((p, idx) => `
            <div class="podium-item ${idx === 0 ? 'first' : ''}">
                <span>${medals[idx] || `${idx + 1}.`} ${escapeHtml(p.name)}</span>
                <strong>${p.score} Punkte</strong>
            </div>
        `).join("");
    }
</script>
