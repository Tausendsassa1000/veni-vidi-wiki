<!DOCTYPE html>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; }
        .container { max-width: 760px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 22px; overflow: hidden; }
        header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; position: relative; }
        h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
        .sound-btn { position: absolute; right: 0; top: 0; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 5px 10px; font-size: 0.85rem; cursor: pointer; font-weight: 600; color: var(--text); }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
        @media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } .sound-btn { position: static; margin-top: 8px; } }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 9px 11px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.98rem; background: #fff; }
        select:focus, input:focus { outline: none; border-color: var(--primary); }
        .player-setup { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .player-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; }
        .player-tag small { opacity: 0.85; font-size: 0.78rem; }
        .player-tag button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0; font-size: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 11px 18px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-small { padding: 8px 13px; font-size: 0.88rem; width: auto; }
        .hidden { display: none !important; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .status-badges { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
        .badge { padding: 4px 9px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        .badge-points { background: #dbeafe; color: #1e40af; }
        .badge-timer { background: #fef3c7; color: #92400e; font-variant-numeric: tabular-nums; min-width: 74px; text-align: center; display: inline-block; }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }
        @media (max-width: 480px) { .status-bar { padding: 8px 10px; font-size: 0.88rem; } .badge { font-size: 0.8rem; padding: 4px 7px; } .badge-timer { min-width: 66px; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.65; font-size: 1.02rem; min-height: 120px; width: 100%; overflow-wrap: break-word; word-wrap: break-word; }
        .wiki-paragraph { margin-bottom: 10px; animation: fadeIn 0.35s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 3px; user-select: none; overflow-wrap: anywhere; word-break: break-word; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        @media (max-width: 500px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 11px; border-radius: 8px; font-size: 0.96rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
        .text-input-group { display: flex; gap: 10px; margin-bottom: 14px; }
        .controls-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .feedback { padding: 13px; border-radius: 10px; margin-bottom: 14px; font-weight: 600; text-align: center; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }
        .feedback.tie { background: #fef3c7; color: #92400e; }
        .scoreboard { margin-top: 16px; border-top: 2px solid #e2e8f0; padding-top: 12px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .score-card { background: #f1f5f9; padding: 7px 12px; border-radius: 8px; font-size: 0.9rem; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }
        .podium { text-align: center; padding: 15px 0; }
        .podium-item { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 1.05rem; }
        .podium-item.first { background: #fef9c3; border-color: #eab308; font-weight: bold; }

</head>

<div class="container">
    <header>
        <h1>Veni, vidi, <span>wiki</span></h1>
        <div class="subtitle" id="t-subtitle">Errate den Wikipedia-Eintrag – je weniger Hinweise, desto mehr Punkte!</div>
        <button type="button" class="sound-btn" id="sound-toggle">🔊 Ton an</button>
    </header>

    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select" id="t-lbl-lang">Sprache</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="es">Español</option>
                </select>
            </div>
            <div>
                <label for="category-select" id="t-lbl-cat">Kategorie</label>
                <select id="category-select"></select>
            </div>
            <div>
                <label for="diff-select" id="t-lbl-diff">Schwierigkeitsgrad</label>
                <select id="diff-select"></select>
            </div>
            <div>
                <label for="input-mode" id="t-lbl-mode">Rate-Modus</label>
                <select id="input-mode"></select>
            </div>
            <div>
                <label for="rounds-input" id="t-lbl-rounds">Runden pro Spieler</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
            <div>
                <label for="timer-select" id="t-lbl-timer">Timer pro Runde</label>
                <select id="timer-select"></select>
            </div>
        </div>

        <div class="player-setup">
            <label id="t-lbl-players">Spieler (Solo = 1, Multiplayer = mehrere Namen)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="Spielername..." maxlength="20">
                <button type="button" class="btn btn-small" id="add-player-btn">+ Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button type="button" class="btn" id="start-btn">Spiel starten</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <div><span id="t-turn">Am Zug:</span> <strong id="current-player-display">Spieler 1</strong> · <span id="round-display">Runde 1/10</span> (<span id="category-badge"></span>)</div>
            <div class="status-badges">
                <span class="badge badge-points" id="points-badge">3 Pkt.</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text"></div>
        <div id="feedback-box" class="feedback hidden"></div>
        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="...">
            <button type="button" class="btn btn-small" id="submit-text-btn">Prüfen</button>
        </div>

        <div class="controls-row">
            <button type="button" id="hint-btn" class="btn btn-secondary btn-small">🔍 Weiteren Text (-1 Pkt.)</button>
            <button type="button" id="next-round-btn" class="btn btn-small hidden">Weiter ➔</button>
            <button type="button" id="menu-btn" class="btn btn-secondary btn-small">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;" id="t-scores">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <div class="podium">
            <h2 id="t-podium-title">🏆 Siegerehrung</h2>
            <div id="podium-list" style="margin: 16px 0;"></div>
            <button type="button" class="btn" id="restart-btn">Neues Spiel</button>
        </div>
    </div>
</div>

let players = [{ name: "Spieler 1", score: 0 }];

function getPlayerHistory(name) {
    try {
        const key = "vvw_hist_" + name.trim().toLowerCase();
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
    } catch (e) { return new Set(); }
}

function savePlayerHistory(name, term) {
    try {
        const key = "vvw_hist_" + name.trim().toLowerCase();
        const set = getPlayerHistory(name);
        set.add(term);
        localStorage.setItem(key, JSON.stringify(Array.from(set)));
    } catch (e) {}
}

function playTone(type) {
    if (!soundEnabled) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === "win") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now); osc.stop(now + 0.45);
        } else if (type === "lose") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.35);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
            osc.start(now); osc.stop(now + 0.38);
        } else if (type === "hint") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === "tick") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.start(now); osc.stop(now + 0.06);
        } else if (type === "fanfare") {
            osc.type = "triangle";
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.12));
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
            osc.start(now); osc.stop(now + 0.65);
        }
    } catch (e) {}
}

    sel.innerHTML = Object.keys(map).map(k => `<option value="${k}">${map[k]}</option>`).join("");

function addPlayerFromInput() {
    const input = document.getElementById("player-name-input");
    const name = input.value.trim();
    if (!name || players.length >= 8) return;
    if (players.length === 1 && players[0].name === "Spieler 1") players = [];
    if (!players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        players.push({ name: name, score: 0 });
    }
    input.value = "";
    renderPlayerTags();
}

function renderPlayerTags() {
    const tr = t();
    const container = document.getElementById("player-tags");
    container.innerHTML = "";
    players.forEach((p, idx) => {
        const histCount = getPlayerHistory(p.name).size;
        const tag = document.createElement("div");
        tag.className = "player-tag";
        const span = document.createElement("span");
        span.innerHTML = `${p.name} ${histCount > 0 ? `<small>(${histCount} ${tr.played})</small>` : ""}`;
        tag.appendChild(span);
        if (players.length > 1) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "×";
            btn.onclick = () => { players.splice(idx, 1); renderPlayerTags(); };
            tag.appendChild(btn);
        }
        container.appendChild(tag);
    });
}

function startGame() {
    addPlayerFromInput();
    players.forEach(p => p.score = 0);
    maxRounds = Math.max(1, Math.min(100, parseInt(document.getElementById("rounds-input").value) || 10));
    currentRound = 1;
    isTieBreaker = false;
    activeIndices = players.map((_, i) => i);
    currentPlayerIndex = activeIndices[0];

    document.getElementById("setup-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.remove("hidden");
    loadNextRound();
}

function backToMenu() {
    clearInterval(timerInterval);
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("setup-screen").classList.remove("hidden");
    renderPlayerTags();
}

function updateScoreboard() {
    const tr = t();
    document.getElementById("scoreboard-list").innerHTML = players.map((p, idx) => `
        <div class="score-card ${idx === currentPlayerIndex ? 'active' : ''}">
            ${p.name}: <strong>${p.score} ${tr.pts}</strong>

async function fetchDynamicPool(catKey) {
    try {
        const wikiCat = DB[catKey].wikiCat;
        const url = `https://de.wikipedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Kategorie:${encodeURIComponent(wikiCat)}&cmnamespace=0&cmlimit=40&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        return (data.query.categorymembers || []).map(m => m.title).filter(title => !title.includes(":"));
    } catch (e) { return []; }
}

async function loadNextRound(retryCount = 0) {
    clearInterval(timerInterval);
    roundActive = false;
    revealedCount = 1;
    possiblePoints = 3;

    const tr = t();
    const player = players[currentPlayerIndex];
    const history = getPlayerHistory(player.name);

    document.getElementById("feedback-box").classList.add("hidden");
    document.getElementById("next-round-btn").classList.add("hidden");
    document.getElementById("hint-btn").classList.remove("hidden");
    document.getElementById("hint-btn").disabled = false;
    document.getElementById("wiki-text").innerHTML = `<em>${tr.loading}</em>`;
    document.getElementById("mc-area").classList.add("hidden");
    document.getElementById("text-area").classList.add("hidden");

    document.getElementById("current-player-display").textContent = player.name;
    document.getElementById("round-display").textContent = isTieBreaker ? tr.tieRound : `${tr.round} ${currentRound}/${maxRounds}`;
    updatePointsBadge();
    updateScoreboard();

    const selectedCat = document.getElementById("category-select").value;
    const catKeys = Object.keys(DB);
    currentCatKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;
    document.getElementById("category-badge").textContent = tr.cats[currentCatKey].replace(/^[^\s]+\s/, "");

    const diff = document.getElementById("diff-select").value;
    const clusters = DB[currentCatKey].clusters;
    currentCluster = clusters[Math.floor(Math.random() * clusters.length)];

    let candidates = (currentCluster[diff] || []).filter(item => !history.has(item));
    if (candidates.length === 0) {
        const allInCat = clusters.flatMap(c => [...c.easy, ...c.medium, ...c.hard]).filter(item => !history.has(item));
        candidates = allInCat;
    }
    if (candidates.length === 0) {
        const dynamic = await fetchDynamicPool(currentCatKey);
        candidates = dynamic.filter(item => !history.has(item));
        if (candidates.length > 3) {
            currentCluster = { [diff]: candidates };
        }
    }
    if (candidates.length === 0) {
        candidates = currentCluster[diff] || clusters[0].medium;
    }

    currentTargetDe = candidates[Math.floor(Math.random() * candidates.length)];
    savePlayerHistory(player.name, currentTargetDe);

    const lang = getLang();
    try {
        const article = await fetchWikiArticle(currentTargetDe, lang, diff);
        currentDisplayTitle = article.title;
        paragraphs = article.paragraphs;

        if (paragraphs.length === 0 && retryCount < 4) {
            return loadNextRound(retryCount + 1);
        }

        const firstVisibleWords = countVisibleWords(redactText(paragraphs[0] || "", currentDisplayTitle));
        if (firstVisibleWords < 3 && paragraphs.length > 1) {
            revealedCount = 2;
        }

        if (revealedCount >= paragraphs.length) {
            document.getElementById("hint-btn").classList.add("hidden");
        }

        renderWikiText(false);
        await setupAnswerArea(lang, diff);
        roundActive = true;
        startTimer();
    } catch (e) {
        if (retryCount < 3) return loadNextRound(retryCount + 1);
        document.getElementById("wiki-text").textContent = "Wikipedia Error.";
        document.getElementById("next-round-btn").classList.remove("hidden");
    }
}

async function fetchWikiArticle(germanTitle, targetLang, diff) {
    let titleToFetch = germanTitle;
    if (targetLang !== "de") {
        const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&prop=langlinks&lllang=${targetLang}&redirects=1&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = pages[Object.keys(pages)[0]];
        if (page && page.langlinks && page.langlinks.length > 0) {
            titleToFetch = page.langlinks[0]["*"];
        }
    }

    const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
    const response = await fetch(apiUrl);
    const json = await response.json();
    const pages = json.query.pages;
    const page = pages[Object.keys(pages)[0]];

    const rawParas = (page.extract || "")
        .split("
")
        .map(p => p.trim())
        .filter(p => p.length > 45 && !p.startsWith("=="));

    let resultParas = [];
    if (rawParas.length > 0) {
        const startIdx = (diff === "hard" && rawParas.length > 2) ? 1 : 0;
        const firstP = rawParas[startIdx];
        const sentenceMatch = firstP.match(/^.*?[.!?](?:\s|$)/);
        if (sentenceMatch && sentenceMatch[0].length >= 40 && firstP.length - sentenceMatch[0].length >= 40) {
            resultParas.push(sentenceMatch[0].trim());
            resultParas.push(firstP.slice(sentenceMatch[0].length).trim());
        } else {
            resultParas.push(firstP);
        }
        if (rawParas[startIdx + 1]) resultParas.push(rawParas[startIdx + 1]);
    }

    return { title: page.title || titleToFetch, paragraphs: resultParas.slice(0, 3) };
}

function makeBlock(len) {
    const safeLen = Math.min(20, Math.max(4, len));
    return `<span class="redacted">${"█".repeat(safeLen)}</span>`;
}

function redactText(text, title) {
    let result = text;
    result = result.replace(/\([^()]*\)/g, m => makeBlock(m.length));
    result = result.replace(/\([^()]*\)/g, m => makeBlock(m.length));
    result = result.replace(/\[[^\[\]]*\]/g, m => makeBlock(m.length));

    const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
    const stopWords = new Set(["der", "die", "das", "von", "und", "the", "les", "des", "los", "las", "del", "della"]);
    const words = cleanTitle.split(/[\s\-–]+/).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));

    if (cleanTitle.length > 2) {
        const fullRe = new RegExp(escapeRegExp(cleanTitle), "gi");
        result = result.replace(fullRe, m => makeBlock(m.length));
    }
    words.forEach(w => {
        const wRe = new RegExp(escapeRegExp(w) + "[a-zA-ZäöüÄÖÜßéèàáíóúñ]*", "gi");
        result = result.replace(wRe, m => makeBlock(m.length));
    });
    return result;
}

function countVisibleWords(html) {
    const plain = html.replace(/<span class="redacted">.*?<\/span>/g, " ").replace(/<[^>]+>/g, " ");
    return plain.trim().split(/\s+/).filter(w => w.length > 1).length;
}

function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\]/g, "\$&");
}

function renderWikiText(revealAll) {
    const box = document.getElementById("wiki-text");
    box.innerHTML = paragraphs.slice(0, revealedCount).map(p => {
        const html = revealAll ? p : redactText(p, currentDisplayTitle);
        return `<div class="wiki-paragraph">${html}</div>`;
    }).join("");
}

function revealNextHint() {
    if (!roundActive || revealedCount >= paragraphs.length) return;
    playTone("hint");
    revealedCount++;
    possiblePoints = Math.max(1, 4 - revealedCount);
    updatePointsBadge();
    renderWikiText(false);
    if (revealedCount >= paragraphs.length) {
        document.getElementById("hint-btn").disabled = true;
    }
}

function updatePointsBadge() {
    document.getElementById("points-badge").textContent = `${possiblePoints} ${t().pts}`;
}

async function setupAnswerArea(lang, diff) {
    const mode = document.getElementById("input-mode").value;
    if (mode === "mc") {
        const mcArea = document.getElementById("mc-area");
        mcArea.classList.remove("hidden");
        mcArea.innerHTML = `<em>${t().loadingOpts}</em>`;

        let pool = [...(currentCluster[diff] || [])];
        if (pool.length < 4 && currentCluster.easy) {
            pool = [...new Set([...pool, ...(currentCluster.easy || []), ...(currentCluster.medium || []), ...(currentCluster.hard || [])])];
        }
        const distractorsDe = pool.filter(x => x !== currentTargetDe).sort(() => 0.5 - Math.random()).slice(0, 3);

        let options = [currentDisplayTitle];
        for (const d of distractorsDe) {
            if (lang === "de") {
                options.push(d);
            } else {
                try {
                    const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&prop=langlinks&lllang=${lang}&redirects=1&format=json&origin=*`;
                    const r = await fetch(url);
                    const j = await r.json();
                    const p = j.query.pages[Object.keys(j.query.pages)[0]];
                    options.push(p && p.langlinks ? p.langlinks[0]["*"] : d);
                } catch (e) { options.push(d); }
            }
        }

        options = options.sort(() => 0.5 - Math.random());
        mcArea.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "mc-btn";
            btn.textContent = opt.replace(/\s*\(.*?\)\s*/g, "");
            btn.onclick = () => {
                if (!roundActive) return;
                const ok = opt === currentDisplayTitle;
                mcArea.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
                btn.classList.add(ok ? "correct" : "wrong");
                endRound(ok, false);
            };
            mcArea.appendChild(btn);
        });
    } else {
        const textArea = document.getElementById("text-area");
        const input = document.getElementById("guess-input");
        textArea.classList.remove("hidden");
        input.value = "";
        input.disabled = false;
        input.focus();
    }
}

function submitTextGuess() {
    if (!roundActive) return;
    const guess = document.getElementById("guess-input").value.trim().toLowerCase();
    if (!guess) return;
    const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
    const parts = cleanTarget.split(" ");
    const last = parts[parts.length - 1];
    const ok = guess === cleanTarget || (last.length >= 4 && guess === last);
    document.getElementById("guess-input").disabled = true;
    endRound(ok, false);
}

function startTimer() {
    const limit = parseInt(document.getElementById("timer-select").value);
    const badge = document.getElementById("timer-badge");
    if (limit === 0) { badge.classList.add("hidden"); return; }
    badge.classList.remove("hidden", "urgent");
    timeLeft = limit;
    badge.textContent = `⏱ ${timeLeft}s`;
    timerInterval = setInterval(() => {
        timeLeft--;
        badge.textContent = `⏱ ${timeLeft}s`;
        if (timeLeft <= 5 && timeLeft > 0) playTone("tick");
        if (timeLeft <= 10) badge.classList.add("urgent");
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            endRound(false, true);
        }
    }, 1000);
}

function endRound(won, isTimeout) {
    roundActive = false;
    clearInterval(timerInterval);
    renderWikiText(true);

    const tr = t();
    const fb = document.getElementById("feedback-box");
    fb.classList.remove("hidden", "win", "lose", "tie");
    const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");

    if (won) {
        playTone("win");
        players[currentPlayerIndex].score += possiblePoints;
        fb.classList.add("win");
        fb.textContent = tr.win(cleanTitle, possiblePoints, players[currentPlayerIndex].name);
    } else {
        playTone("lose");
        fb.classList.add("lose");
        fb.textContent = isTimeout ? tr.timeout(cleanTitle) : tr.lose(cleanTitle);
    }

    updateScoreboard();
    document.getElementById("hint-btn").classList.add("hidden");
    document.getElementById("next-round-btn").classList.remove("hidden");
}

function nextTurn() {
    const posInActive = activeIndices.indexOf(currentPlayerIndex);
    if (posInActive + 1 < activeIndices.length) {
        currentPlayerIndex = activeIndices[posInActive + 1];
        loadNextRound();
        return;
    }

    if (!isTieBreaker && currentRound < maxRounds) {
        currentRound++;
        currentPlayerIndex = activeIndices[0];
        loadNextRound();
        return;
    }

    // Check for tie at the top in multiplayer
    if (players.length > 1) {
        const maxScore = Math.max(...activeIndices.map(i => players[i].score));
        const leaders = activeIndices.filter(i => players[i].score === maxScore);
        if (leaders.length > 1) {
            isTieBreaker = true;
            activeIndices = leaders;
            currentPlayerIndex = activeIndices[0];
            const fb = document.getElementById("feedback-box");
            fb.classList.remove("hidden", "win", "lose");
            fb.classList.add("tie");
            fb.textContent = t().tieMsg(leaders.map(i => players[i].name).join(", "));
            setTimeout(() => loadNextRound(), 1800);
            return;
        }
    }

    showPodium();
}

function showPodium() {
    playTone("fanfare");
    const tr = t();
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.remove("hidden");

    const sorted = [...players].sort((a, b) => b.score - a.score);
    const medals = ["🥇", "🥈", "🥉"];
    document.getElementById("podium-list").innerHTML = sorted.map((p, idx) => `
        <div class="podium-item ${idx === 0 ? 'first' : ''}">
            <span>${medals[idx] || (idx + 1) + "."} ${p.name}</span>
            <span>${p.score} ${tr.pts}</span>
        </div>
    `).join("");
}

document.addEventListener("DOMContentLoaded", () => {
    applyTranslations();
    document.getElementById("lang-select").addEventListener("change", applyTranslations);
    document.getElementById("sound-toggle").addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        applyTranslations();
    });
    document.getElementById("add-player-btn").addEventListener("click", addPlayerFromInput);
    document.getElementById("player-name-input").addEventListener("keypress", e => {
        if (e.key === "Enter") addPlayerFromInput();
    });
    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("hint-btn").addEventListener("click", revealNextHint);
    document.getElementById("next-round-btn").addEventListener("click", nextTurn);
    document.getElementById("menu-btn").addEventListener("click", backToMenu);
    document.getElementById("restart-btn").addEventListener("click", backToMenu);
    document.getElementById("submit-text-btn").addEventListener("click", submitTextGuess);
    document.getElementById("guess-input").addEventListener("keypress", e => {
        if (e.key === "Enter") submitTextGuess();
    });
});
</script>
