}

h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.5px; color: #0f172a; }

h1 span { color: var(--primary); }
.subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
.sound-btn { background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text); white-space: nowrap; }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
@media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } }
label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
select, input[type="text"], input[type="number"] { width: 100%; padding: 8px 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #fff; color: var(--text); min-width: 0; }
@media (min-width: 601px) { select, input[type="text"], input[type="number"] { font-size: 0.95rem; } }

.ka2-sel {

  background-image: linear-gradient(45deg, transparent 50%, #2563eb 50%), linear-gradient(135deg, #2563eb 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

.player-setup { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
.player-inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
@media (max-width: 600px) { .player-inputs-grid { grid-template-columns: 1fr; } }
.player-input-row { display: flex; flex-direction: column; gap: 3px; }
.player-input-meta { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.btn { background: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
.btn:hover:not(:disabled) { background: var(--primary-hover); }
.btn:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-secondary { background: #e2e8f0; color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
.btn-small { padding: 8px 14px; font-size: 0.9rem; width: auto; }
.hidden { display: none !important; }
.status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.status-badges { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.badge { padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.badge-points { background: #dbeafe; color: #1e40af; }
.badge-timer { background: #fef3c7; color: #92400e; font-variant-numeric: tabular-nums; min-width: 74px; text-align: center; display: inline-block; }
.badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }
@media (max-width: 480px) {
.status-bar { padding: 8px 10px; font-size: 0.88rem; }
.badge { padding: 4px 8px; font-size: 0.8rem; }
.badge-timer { min-width: 66px; }
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.65; font-size: 1.02rem; min-height: 130px; overflow-wrap: anywhere; word-break: break-word; }
.wiki-paragraph { margin-bottom: 12px; }
.wiki-paragraph:last-child { margin-bottom: 0; }
.redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 3px; user-select: none; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
@media (max-width: 500px) { .mc-grid { grid-template-columns: 1fr; } }
.mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
.mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
.mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
.mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
.text-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
.controls-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.feedback { padding: 14px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; }
.feedback.win { background: #dcfce7; color: #14532d; }
.feedback.lose { background: #fee2e2; color: #7f1d1d; }
.tiebreaker-banner { background: #fef3c7; border: 1.5px solid #f59e0b; color: #92400e; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-weight: 700; text-align: center; }
.scoreboard { margin-top: 18px; border-top: 2px solid #e2e8f0; padding-top: 14px; }
.score-list { display: flex; flex-wrap: wrap; gap: 8px; }
.score-card { background: #f1f5f9; padding: 7px 12px; border-radius: 8px; font-size: 0.92rem; }
.score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }
.podium { text-align: center; padding: 15px 0; }
.podium-item { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
.podium-item.first { background: #fef9c3; border-color: #eab308; font-weight: bold; font-size: 1.15rem; }
#gameRoot.fullscreen-play { position: fixed; top: 10px; left: 0; right: 0; bottom: 10px; max-width: 960px; width: calc(100% - 20px); height: calc(100dvh - 20px); min-height: 0; margin: 0 auto; border-radius: 16px; border: 1.5px solid #cbd5e1; z-index: 2147483647; overscroll-behavior: none; touch-action: manipulation; justify-content: flex-start; overflow: hidden; padding: 12px 16px; }
@media (max-width: 600px) {

#gameRoot.fullscreen-play .subtitle { display: none; }

function getHistoryKey(name) {
return "vvwiki_hist_" + name.trim().toLowerCase().replace(/[^a-z0-9äöüß]/g, "_");
}

function getPlayerHistory(name) {
try {
const raw = localStorage.getItem(getHistoryKey(name));
return raw ? new Set(JSON.parse(raw)) : new Set();
} catch (e) {
return new Set();
}
}

function savePlayerHistory(name, term) {
try {
const set = getPlayerHistory(name);
set.add(term);
localStorage.setItem(getHistoryKey(name), JSON.stringify(Array.from(set)));
} catch (e) {}
}

function playTone(freqs, dur, type) {
if (!soundEnabled) return;
try {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
if (audioCtx.state === "suspended") audioCtx.resume();
freqs.forEach((f, idx) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || "sine";
osc.frequency.value = f;
gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.08);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + dur);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(audioCtx.currentTime + idx * 0.08);
osc.stop(audioCtx.currentTime + idx * 0.08 + dur);
});
} catch (e) {}
}

function isValidWikiTitle(title) {
if (!title || title.includes(":") || title.includes("/")) return false;
if (/^(Liste|Chronik|Geschichte|Begriffsklärung|Nekrolog|\d{3,4})\b/i.test(title)) return false;
return true;
}

async function fetchUnlimitedWikiTerms(catKey, playerHist) {
const pool = WIKI_CAT_POOLS[catKey] || WIKI_CAT_POOLS.places;
const shuffledSeeds = pool.slice().sort(() => 0.5 - Math.random());
const dir = Math.random() > 0.5 ? "newer" : "older";
const randYear = 2005 + Math.floor(Math.random() * 20);
const startTs = randYear + "-01-01T00:00:00Z";

for (let i = 0; i < Math.min(3, shuffledSeeds.length); i++) {
const seed = shuffledSeeds[i];
const url = "https://de.wikipedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Kategorie:" +
encodeURIComponent(seed) + "&cmtype=page&cmlimit=100&cmsort=timestamp&cmdir=" + dir +
"&cmstart=" + startTs + "&format=json&origin=*";
try {
const res = await fetch(url);
const data = await res.json();
if (data.query && data.query.categorymembers) {
const titles = data.query.categorymembers
.map(m => m.title)
.filter(title => isValidWikiTitle(title) && !sessionUsed.has(title) && !playerHist.has(title));
if (titles.length >= 4) {
wikiExtraCache[catKey] = (wikiExtraCache[catKey] || []).concat(titles);
return titles;
}
}
} catch (e) {}
}

try {
const randUrl = "https://de.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=30&format=json&origin=*";
const rRes = await fetch(randUrl);
const rData = await rRes.json();
if (rData.query && rData.query.random) {
const rTitles = rData.query.random
.map(m => m.title)
.filter(title => isValidWikiTitle(title) && !sessionUsed.has(title) && !playerHist.has(title));
if (rTitles.length >= 4) return rTitles;
}
} catch (e) {}
return [];
}

async function loadNextRound(retryCount) {
retryCount = retryCount || 0;
clearInterval(timerInterval);
roundActive = false;
revealedCount = 1;
possiblePoints = 3;
const currentPlayer = activePlayers[currentPlayerIndex];
document.getElementById("feedback-box").classList.add("hidden");
document.getElementById("next-round-btn").classList.add("hidden");
document.getElementById("hint-btn").classList.remove("hidden");
document.getElementById("hint-btn").disabled = false;
document.getElementById("wiki-text").innerHTML = "<em>" + t("loading") + "</em>";
document.getElementById("mc-area").classList.add("hidden");
document.getElementById("text-area").classList.add("hidden");
document.getElementById("current-player-display").textContent = currentPlayer.name;
document.getElementById("round-display").textContent = isTiebreaker
? t("tieBanner").split("!")[0]
: (t("round") + " " + currentRoundNum + "/" + maxRounds);
updatePointsBadge();
updateScoreboard();

const selectedCat = document.getElementById("category-select").value;
const selectedDiff = document.getElementById("diff-select").value;
const catKeys = Object.keys(DB);
currentCategoryKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;
document.getElementById("category-badge").textContent = t("cats")[currentCategoryKey].replace(/^[^\s]+\s/, "");

const playerHist = isDefaultPlayer ? new Set() : getPlayerHistory(currentPlayer.name);
const clusters = DB[currentCategoryKey];
let matchingClusters = clusters.filter(c => c.diff === selectedDiff);
if (matchingClusters.length === 0) matchingClusters = clusters;

let candidates = [];
matchingClusters.forEach(c => {
c.items.forEach(item => {
if (!sessionUsed.has(item) && !playerHist.has(item)) {
candidates.push({ term: item, cluster: c.items });
}
});
});

if (candidates.length === 0) {
clusters.forEach(c => {
c.items.forEach(item => {
if (!sessionUsed.has(item) && !playerHist.has(item)) {
candidates.push({ term: item, cluster: c.items });
}
});
});
}

if (candidates.length === 0) {
let cached = (wikiExtraCache[currentCategoryKey] || []).filter(item => !sessionUsed.has(item) && !playerHist.has(item));
if (cached.length < 4) {
cached = await fetchUnlimitedWikiTerms(currentCategoryKey, playerHist);
}
if (cached.length >= 4) {
cached.forEach(item => candidates.push({ term: item, cluster: cached }));
} else {
sessionUsed.clear();
clusters.forEach(c => c.items.forEach(item => candidates.push({ term: item, cluster: c.items })));
}
}

const chosen = candidates[Math.floor(Math.random() * candidates.length)];
currentTargetDe = chosen.term;
currentClusterItems = chosen.cluster;
sessionUsed.add(currentTargetDe);
if (!isDefaultPlayer) savePlayerHistory(currentPlayer.name, currentTargetDe);

try {
const articleData = await fetchWikiArticle(currentTargetDe, currentLang, selectedDiff);
if (!articleData.paragraphs || articleData.paragraphs.length === 0) {
if (retryCount < 5) return loadNextRound(retryCount + 1);
}
currentDisplayTitle = articleData.title;
paragraphs = articleData.paragraphs;
if (paragraphs.length < 2) {
document.getElementById("hint-btn").classList.add("hidden");
}
renderWikiText(false);
await setupAnswerArea(currentLang);
roundActive = true;
startTimer();
} catch (err) {
if (retryCount < 4) return loadNextRound(retryCount + 1);
document.getElementById("next-round-btn").classList.remove("hidden");
}
}

function splitIntoSentences(text) {
const protectedText = text.replace(/\b(\d{1,2}|Dr|Prof|St|Mr|Mrs|Ms|ca|bzw|usw|z\.B|d\.h|etc|vgl|Nr|Jh|Mio|Mrd)\./gi, "$1\u0001");
const rawSentences = protectedText.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g) || [protectedText];
return rawSentences.map(s => s.replace(/\u0001/g, ".").trim()).filter(s => s.length > 0);
}

function countVisibleWords(rawText, title) {
const redactedHtml = redactText(rawText, title);
const plainVisible = redactedHtml.replace(/<[^>]*>/g, " ").replace(/█+/g, " ");
const words = plainVisible.match(/[a-zA-ZäöüÄÖÜßéèêàáâíìîóòôúùûñç]{2,}/g) || [];
return words.length;
}

async function fetchWikiArticle(germanTitle, targetLang, diff) {
let titleToFetch = germanTitle;
if (targetLang !== "de") {
const llUrl = "https://de.wikipedia.org/w/api.php?action=query&titles=" + encodeURIComponent(germanTitle) + "&prop=langlinks&lllang=" + targetLang + "&redirects=1&format=json&origin=*";
const res = await fetch(llUrl);
const data = await res.json();
const pages = data.query.pages;
const pid = Object.keys(pages)[0];
if (pages[pid].langlinks && pages[pid].langlinks.length > 0) {
titleToFetch = pages[pid].langlinks[0]["*"];
}
}
const apiUrl = "https://" + targetLang + ".wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exintro=0&redirects=1&titles=" + encodeURIComponent(titleToFetch) + "&format=json&origin=*";
const response = await fetch(apiUrl);
const json = await response.json();
const pages = json.query.pages;
const page = pages[Object.keys(pages)[0]];
const extract = page.extract || "";
const rawParas = extract.split("\n").map(p => p.trim()).filter(p => p.length > 45 && !p.startsWith("=="));
const startIdx = (diff === "hard" && rawParas.length > 2) ? 1 : 0;
const firstPara = rawParas[startIdx] || "";
const secondPara = rawParas[startIdx + 1] || "";

const sentences = splitIntoSentences(firstPara);
let hint1 = "";
let usedSentences = 0;

if (sentences.length > 0) {
hint1 = sentences[0];
usedSentences = 1;
if (countVisibleWords(hint1, page.title) < 3 && sentences.length > 1) {
hint1 = sentences[0] + " " + sentences[1];
usedSentences = 2;
}
} else {
hint1 = firstPara.slice(0, 140);
}

const restOfFirstPara = sentences.length > usedSentences
? sentences.slice(usedSentences).join(" ").trim()
: "";

const resultParas = [];
if (hint1) resultParas.push(hint1);
if (restOfFirstPara) resultParas.push(restOfFirstPara);
if (secondPara) resultParas.push(secondPara);
return { title: page.title, paragraphs: resultParas.slice(0, 3) };
}

function escapeRegExp(str) {
return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function makeBlock(len) {
return '<span class="redacted">' + "█".repeat(Math.min(Math.max(len, 3), 18)) + "</span>";
}

function extractWordParts(word) {
const parts = new Set();
const lower = word.toLowerCase();
const ignoreParts = ["ung", "heit", "keit", "schaft", "lich", "isch", "tion", "ment", "ieren", "ende", "enen", "er", "en", "es", "te", "ten"];
if (lower.length >= 6) {
const stemLen = Math.max(4, Math.floor(lower.length * 0.65));
parts.add(lower.slice(0, stemLen));
}
if (lower.length >= 8) {
for (let i = 4; i <= lower.length - 4; i++) {
const left = lower.slice(0, i);
const right = lower.slice(i);
if (!ignoreParts.includes(left) && left.length >= 4) parts.add(left);
if (!ignoreParts.includes(right) && right.length >= 4) parts.add(right);
if (right.startsWith("s") && right.length >= 5 && !ignoreParts.includes(right.slice(1))) {
parts.add(right.slice(1));
}
if (right.startsWith("en") && right.length >= 6 && !ignoreParts.includes(right.slice(2))) {
parts.add(right.slice(2));
}
}
}
return Array.from(parts);
}

function redactText(text, title) {
let res = text;
for (let i = 0; i < 3; i++) {
res = res.replace(/\([^()]*\)/g, m => makeBlock(m.length));
res = res.replace(/\[[^\[\]]*\]/g, m => makeBlock(m.length));
}
const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
if (cleanTitle.length > 1) {
res = res.replace(new RegExp(escapeRegExp(cleanTitle), "gi"), m => makeBlock(m.length));
}
const stopWords = ["der", "die", "das", "von", "und", "the", "les", "des", "del", "los", "las", "una", "ein", "eine", "für", "mit", "auf", "aus", "bei", "zum", "zur"];
const wordChars = "[a-zA-ZäöüÄÖÜßéèêàáâíìîóòôúùûñç\\-]";
const tokens = new Set();
cleanTitle.split(/[\s\-–]+/).forEach(w => {
const cleanW = w.replace(/[^a-zA-ZäöüÄÖÜßéèêàáâíìîóòôúùûñç]/g, "");
if (cleanW.length > 2 && !stopWords.includes(cleanW.toLowerCase())) {
tokens.add(cleanW);
extractWordParts(cleanW).forEach(p => {
if (!stopWords.includes(p.toLowerCase())) tokens.add(p);
});
}
});
Array.from(tokens).sort((a, b) => b.length - a.length).forEach(tok => {
const rx = new RegExp(wordChars + "*" + escapeRegExp(tok) + wordChars + "*", "gi");
res = res.replace(rx, m => makeBlock(m.length));
});
return res;
}

function renderWikiText(revealAll) {
const box = document.getElementById("wiki-text");
box.innerHTML = "";
paragraphs.slice(0, revealedCount).forEach(p => {
const div = document.createElement("div");
div.className = "wiki-paragraph";
div.innerHTML = revealAll ? p : redactText(p, currentDisplayTitle);
box.appendChild(div);
});
}

function revealNextHint() {
if (!roundActive || revealedCount >= paragraphs.length) return;
revealedCount++;
possiblePoints = Math.max(1, 4 - revealedCount);
updatePointsBadge();
renderWikiText(false);
playTone([440], 0.08, "triangle");
if (revealedCount >= paragraphs.length) {
document.getElementById("hint-btn").disabled = true;
}
}

function updatePointsBadge() {
document.getElementById("points-badge").textContent = t("points") + ": " + possiblePoints;
}

async function setupAnswerArea(lang) {
const mode = document.getElementById("input-mode").value;
if (mode === "mc") {
const mcArea = document.getElementById("mc-area");
mcArea.classList.remove("hidden");
mcArea.innerHTML = "";
const distractors = currentClusterItems
.filter(item => item !== currentTargetDe)
.sort(() => 0.5 - Math.random())
.slice(0, 3);
const options = [currentDisplayTitle];
for (let i = 0; i < distractors.length; i++) {
const d = distractors[i];
if (lang === "de") {
options.push(d);
} else {
try {
const url = "https://de.wikipedia.org/w/api.php?action=query&titles=" + encodeURIComponent(d) + "&prop=langlinks&lllang=" + lang + "&redirects=1&format=json&origin=*";
const r = await fetch(url);
const j = await r.json();
const p = j.query.pages[Object.keys(j.query.pages)[0]];
options.push(p.langlinks ? p.langlinks[0]["*"] : d);
} catch (e) {
options.push(d);
}
}
}
options.sort(() => 0.5 - Math.random()).forEach(opt => {
const btn = document.createElement("button");
btn.type = "button";
btn.className = "mc-btn";
btn.textContent = opt.replace(/\s*\(.*?\)\s*/g, "");
btn.onclick = () => {
if (!roundActive) return;
document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
const isCorrect = opt === currentDisplayTitle;
btn.classList.add(isCorrect ? "correct" : "wrong");
endRound(isCorrect, false);
};
mcArea.appendChild(btn);
});
} else {
const textArea = document.getElementById("text-area");
const input = document.getElementById("guess-input");
textArea.classList.remove("hidden");
input.value = "";
input.disabled = false;
input.focus();
}
}

function submitTextGuess() {
if (!roundActive) return;
const guess = document.getElementById("guess-input").value.trim().toLowerCase();
if (!guess) return;
const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
const parts = cleanTarget.split(" ");
const lastWord = parts[parts.length - 1];
const isCorrect = guess === cleanTarget || (lastWord.length >= 4 && guess === lastWord);
document.getElementById("guess-input").disabled = true;
endRound(isCorrect, false);
}

function startTimer() {
const limit = parseInt(document.getElementById("timer-select").value, 10);
const badge = document.getElementById("timer-badge");
if (limit === 0) {
badge.classList.add("hidden");
return;
}
badge.classList.remove("hidden", "urgent");
timeLeft = limit;
badge.textContent = "↺ " + timeLeft + "s";
timerInterval = setInterval(() => {
timeLeft--;
badge.textContent = "↺ " + timeLeft + "s";
if (timeLeft <= 5 && timeLeft > 0) {

badge.classList.add("urgent");
playTone([880], 0.05, "sine");
}
if (timeLeft <= 0) {
clearInterval(timerInterval);
endRound(false, true);
}
}, 1000);
}

function endRound(won, isTimeout) {
roundActive = false;
clearInterval(timerInterval);
renderWikiText(true);
const fb = document.getElementById("feedback-box");
fb.classList.remove("hidden", "win", "lose");
const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");
if (won) {
activePlayers[currentPlayerIndex].score += possiblePoints;
fb.classList.add("win");
fb.textContent = t("winMsg").replace("{title}", cleanTitle).replace("{pts}", possiblePoints);
playTone([523.25, 659.25, 783.99], 0.16, "triangle");
} else {
fb.classList.add("lose");
const tpl = isTimeout ? t("timeoutMsg") : t("loseMsg");
fb.textContent = tpl.replace("{title}", cleanTitle);
playTone([220, 185], 0.22, "sawtooth");
}
updateScoreboard();
document.getElementById("hint-btn").classList.add("hidden");
document.getElementById("next-round-btn").classList.remove("hidden");
}

function nextTurn() {
currentPlayerIndex++;
if (currentPlayerIndex >= activePlayers.length) {
currentPlayerIndex = 0;
if (!isTiebreaker) currentRoundNum++;
if (currentRoundNum > maxRounds || isTiebreaker) {
const sorted = players.slice().sort((a, b) => b.score - a.score);
const topScore = sorted[0].score;
const leaders = sorted.filter(p => p.score === topScore);
if (leaders.length > 1 && players.length > 1) {
isTiebreaker = true;
activePlayers = leaders;
document.getElementById("tiebreaker-banner").classList.remove("hidden");
loadNextRound();
return;
} else {
showPodium(sorted);
return;
}
}
}
loadNextRound();
}

function showPodium(sortedPlayers) {
hasSuspendedGame = false;
document.getElementById("resumeBtn").classList.add("hidden");
document.getElementById("game-screen").classList.add("hidden");
document.getElementById("end-screen").classList.remove("hidden");
playTone([523.25, 659.25, 783.99, 1046.5], 0.2, "triangle");
const list = document.getElementById("podium-list");
list.innerHTML = "";
const medals = Array.of("1. ★", "2.", "3.");
sortedPlayers.forEach((p, idx) => {
const div = document.createElement("div");
div.className = "podium-item" + (idx === 0 ? " first" : "");
const medal = medals.at(idx) || (idx + 1) + ".";
div.innerHTML = "<span>" + medal + " " + p.name + "</span><span>" + p.score + " " + t("ptsShort") + "</span>";
list.appendChild(div);
});
}

document.getElementById("lang-select").addEventListener("change", updateUILanguage);
document.getElementById("sound-toggle-btn").addEventListener("click", () => {
soundEnabled = !soundEnabled;
document.getElementById("sound-toggle-btn").textContent = soundEnabled ? t("soundOn") : t("soundOff");
});
document.getElementById("player-count-select").addEventListener("change", renderPlayerInputs);
document.getElementById("start-game-btn").addEventListener("click", startGame);
document.getElementById("hint-btn").addEventListener("click", revealNextHint);
document.getElementById("next-round-btn").addEventListener("click", nextTurn);
document.getElementById("menu-btn").addEventListener("click", backToMenu);
document.getElementById("submit-guess-btn").addEventListener("click", submitTextGuess);
document.getElementById("guess-input").addEventListener("keypress", e => {
if (e.key === "Enter") submitTextGuess();
});
document.getElementById("play-again-btn").addEventListener("click", backToMenu);
document.getElementById("exitFsBtn").addEventListener("click", suspendToMenu);
document.getElementById("resumeBtn").addEventListener("click", resumeGame);

updateUILanguage();
})();
</script>
