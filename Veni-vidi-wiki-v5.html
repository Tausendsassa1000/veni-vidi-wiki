<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veni, vidi, wiki</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 780px; width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 25px; position: relative; }
        
        header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; position: relative; }
        h1 { margin: 0; font-size: 2rem; letter-spacing: -0.5px; color: #0f172a; }
        h1 span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 5px; }

        .sound-toggle { position: absolute; top: 0; right: 0; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text); transition: 0.2s; }
        .sound-toggle:hover { background: #e2e8f0; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } .sound-toggle { position: static; margin-top: 10px; } }

        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: #fff; }
        select:focus, input:focus { outline: none; border-color: var(--primary); }

        .player-setup { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .player-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .player-tag button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0; font-size: 1rem; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-small { padding: 8px 14px; font-size: 0.9rem; width: auto; }

        .hidden { display: none !important; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 16px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; }
        .badge-round { background: #e2e8f0; color: #334155; }
        .badge-tiebreaker { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
        .badge-points { background: #dbeafe; color: #1e40af; }
        .badge-timer { background: #fef3c7; color: #92400e; }
        .badge-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .wiki-box { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 20px; line-height: 1.65; font-size: 1.05rem; min-height: 120px; }
        .wiki-paragraph { margin-bottom: 12px; animation: fadeIn 0.4s ease; }
        .wiki-paragraph:last-child { margin-bottom: 0; }
        .redacted { background-color: #1e293b; color: #1e293b; border-radius: 3px; padding: 0 4px; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 500px) { .mc-grid { grid-template-columns: 1fr; } }
        .mc-btn { background: #f8fafc; border: 2px solid #cbd5e1; color: var(--text); padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; }
        .mc-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .mc-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; }
        .mc-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }

        .text-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

        .feedback { padding: 15px; border-radius: 10px; margin-bottom: 15px; font-weight: 600; text-align: center; }
        .feedback.win { background: #dcfce7; color: #14532d; }
        .feedback.lose { background: #fee2e2; color: #7f1d1d; }
        .feedback.info { background: #fef3c7; color: #92400e; }

        .scoreboard { margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
        .score-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .score-card { background: #f1f5f9; padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; }
        .score-card.active { border: 2px solid var(--primary); background: #eff6ff; font-weight: bold; }

        .podium { text-align: center; padding: 20px 10px; }
        .podium h2 { font-size: 1.8rem; margin-bottom: 15px; color: #0f172a; }
        .podium-list { list-style: none; padding: 0; max-width: 420px; margin: 0 auto 25px auto; }
        .podium-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 12px 18px; border-radius: 10px; margin-bottom: 10px; font-size: 1.1rem; }
        .podium-item.first { background: #fef9c3; border-color: #eab308; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Veni, vidi, <span>wiki</span></h1>
        <div class="subtitle">Errate den Wikipedia-Eintrag – je weniger Hinweise, desto mehr Punkte!</div>
        <button id="sound-btn" class="sound-toggle" type="button" onclick="toggleSound()">🔊 Ton an</button>
    </header>

    <div id="setup-screen">
        <div class="setup-grid">
            <div>
                <label for="lang-select">Sprache der Artikel</label>
                <select id="lang-select">
                    <option value="de" selected>Deutsch (Standard)</option>
                    <option value="en">Englisch</option>
                    <option value="fr">Französisch</option>
                    <option value="it">Italienisch</option>
                </select>
            </div>
            <div>
                <label for="category-select">Kategorie</label>
                <select id="category-select">
                    <option value="all" selected>🎲 Quer-durch (Alle Kategorien)</option>
                    <option value="people">👤 Persönlichkeiten</option>
                    <option value="places">🌍 Länder, Städte & Bauwerke</option>
                    <option value="nature">🦁 Tiere & Natur</option>
                    <option value="culture">🎬 Film, Musik & Kultur</option>
                    <option value="science">🔬 Wissenschaft & Erfindung</option>
                    <option value="sport">⚽ Sport</option>
                    <option value="food">🍝 Essen & Trinken</option>
                </select>
            </div>
            <div>
                <label for="difficulty-select">Schwierigkeitsgrad</label>
                <select id="difficulty-select">
                    <option value="easy">🟢 Leicht</option>
                    <option value="medium" selected>🟡 Mittel</option>
                    <option value="expert">🔴 Experte</option>
                </select>
            </div>
            <div>
                <label for="input-mode">Rate-Modus</label>
                <select id="input-mode">
                    <option value="mc" selected>Multiple Choice (4 Auswahlmöglichkeiten)</option>
                    <option value="text">Freies Textfeld (Für Profis)</option>
                </select>
            </div>
            <div>
                <label for="rounds-input">Runden pro Spieler</label>
                <input type="number" id="rounds-input" value="10" min="1" max="100">
            </div>
            <div>
                <label for="timer-select">Timer pro Runde</label>
                <select id="timer-select">
                    <option value="30">30 Sekunden</option>
                    <option value="45" selected>45 Sekunden</option>
                    <option value="60">60 Sekunden</option>
                    <option value="0">Kein Timer</option>
                </select>
            </div>
        </div>

        <div class="player-setup">
            <label for="player-name-input">Spieler (Solo = 1 Spieler, Multiplayer = mehrere Namen hinzufügen)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="Spielername eingeben..." maxlength="20">
                <button type="button" id="add-player-btn" class="btn btn-small">Hinzufügen</button>
            </div>
            <div class="player-tags" id="player-tags"></div>
        </div>

        <button type="button" class="btn" onclick="startGame()">Spiel starten</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <div>Am Zug: <strong id="current-player-display">Spieler 1</strong> (<span id="category-badge">Quer-durch</span>)</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span class="badge badge-round" id="round-badge">Runde 1 / 10</span>
                <span class="badge badge-points" id="points-badge">Punkte: 3</span>
                <span class="badge badge-timer" id="timer-badge">⏱ 45s</span>
            </div>
        </div>

        <div class="wiki-box" id="wiki-text">
            Lade Wikipedia-Artikel...
        </div>

        <div id="feedback-box" class="feedback hidden"></div>

        <div id="mc-area" class="mc-grid hidden"></div>

        <div id="text-area" class="text-input-group hidden">
            <input type="text" id="guess-input" placeholder="Gesuchten Begriff eintippen...">
            <button type="button" class="btn btn-small" onclick="submitTextGuess()">Prüfen</button>
        </div>

        <div class="controls-row">
            <button type="button" id="hint-btn" class="btn btn-secondary btn-small" onclick="revealNextHint()">🔍 Weiteren Text zeigen (-1 Punkt)</button>
            <button type="button" id="next-round-btn" class="btn btn-small hidden" onclick="nextTurn()">Nächste Runde ➔</button>
            <button type="button" class="btn btn-secondary btn-small" onclick="backToMenu()">Menü</button>
        </div>

        <div class="scoreboard">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;">Punktestand:</div>
            <div class="score-list" id="scoreboard-list"></div>
        </div>
    </div>

    <div id="end-screen" class="hidden podium">
        <h2>🏆 Spielende & Siegerehrung</h2>
        <ul class="podium-list" id="podium-list"></ul>
        <div style="display: flex; gap: 10px; justify-content: center; max-width: 420px; margin: 0 auto;">
            <button type="button" class="btn" onclick="startGame()">Nochmal spielen</button>
            <button type="button" class="btn btn-secondary" onclick="backToMenu()">Zum Menü</button>
        </div>
    </div>
</div>

                    expert: ["Absinth", "Kombucha", "Grappa", "Mezcal", "Sherry", "Portwein", "Ayran"]
                },
                {
                    easy: ["Croissant", "Tiramisu", "Schokolade", "Apfelstrudel", "Pfannkuchen", "Baguette", "Brezel"],
                    medium: ["Macaron", "Baklava", "Crème brûlée", "Schwarzwälder Kirschtorte", "Sachertorte", "Churros", "Panettone"],
                    expert: ["Bündner Nusstorte", "Panna cotta", "Zimtsterne", "Pastéis de Nata", "Stollen (Gebäck)", "Profiterole", "Mille-feuille"]
                }
            ]
        }
    };

    let players = [{ name: "Spieler 1", score: 0 }];
    let currentPlayerIndex = 0;
    let sessionUsedTerms = new Set();

    let totalRoundsPerPlayer = 10;
    let currentRoundNumber = 1;
    let isTiebreaker = false;
    let activePlayerIndices = [];
    let activeTurnPointer = 0;

    let currentTargetDe = "";
    let currentDisplayTitle = "";
    let currentCategoryKey = "";
    let currentCluster = null;
    let currentDifficulty = "medium";
    let paragraphs = [];
    let revealedCount = 1;
    let possiblePoints = 3;
    let roundActive = false;
    let timerInterval = null;
    let timeLeft = 45;

    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
            }
        }
        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById("sound-btn");
        btn.textContent = soundEnabled ? "🔊 Ton an" : "🔇 Ton aus";
        if (soundEnabled) {
            initAudio();
            playSound("click");
        }
    }

    function playSound(type) {
        if (!soundEnabled) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(520, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === "hint") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.linearRampToValueAtTime(460, now + 0.12);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.start(now);
            osc.stop(now + 0.14);
        } else if (type === "tick") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
        } else if (type === "win") {
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = "triangle";
                o.frequency.setValueAtTime(freq, now + i * 0.09);
                g.gain.setValueAtTime(0.12, now + i * 0.09);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(now + i * 0.09);
                o.stop(now + i * 0.09 + 0.25);
            });
        } else if (type === "lose") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.35);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
            osc.start(now);
            osc.stop(now + 0.36);
        } else if (type === "fanfare") {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = "triangle";
                o.frequency.setValueAtTime(freq, now + i * 0.12);
                g.gain.setValueAtTime(0.14, now + i * 0.12);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(now + i * 0.12);
                o.stop(now + i * 0.12 + 0.4);
            });
        }
    }

    function addPlayer() {
        const input = document.getElementById("player-name-input");
        if (!input) return;
        const name = input.value.trim();
        if (!name) return;

        if (players.length >= 10) {
            alert("Es sind maximal 10 Spieler möglich.");
            return;
        }

        if (players.length === 1 && players[0].name === "Spieler 1") {
            players = [];
        }

        players.push({ name: name, score: 0 });
        input.value = "";
        input.focus();
        renderPlayerTags();
        playSound("click");
    }

    function removePlayer(index) {
        if (players.length > 1) {
            players.splice(index, 1);
            renderPlayerTags();
            playSound("click");
        }
    }

    function renderPlayerTags() {
        const container = document.getElementById("player-tags");
        if (!container) return;
        container.innerHTML = "";
        players.forEach((p, idx) => {
            const tag = document.createElement("div");
            tag.className = "player-tag";

            const span = document.createElement("span");
            span.textContent = p.name;
            tag.appendChild(span);

            if (players.length > 1) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = "×";
                btn.onclick = () => removePlayer(idx);
                tag.appendChild(btn);
            }

            container.appendChild(tag);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderPlayerTags();
        const addBtn = document.getElementById("add-player-btn");
        if (addBtn) addBtn.addEventListener("click", addPlayer);

        const nameInput = document.getElementById("player-name-input");
        if (nameInput) {
            nameInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    addPlayer();
                }
            });
        }

        const guessInput = document.getElementById("guess-input");
        if (guessInput) {
            guessInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    submitTextGuess();
                }
            });
        }
    });

    function startGame() {
        playSound("click");
        const roundsVal = parseInt(document.getElementById("rounds-input").value, 10);
        totalRoundsPerPlayer = (isNaN(roundsVal) || roundsVal < 1) ? 10 : Math.min(100, roundsVal);
        currentDifficulty = document.getElementById("difficulty-select").value;

        players.forEach(p => p.score = 0);
        activePlayerIndices = players.map((_, idx) => idx);
        activeTurnPointer = 0;
        currentPlayerIndex = activePlayerIndices[0];
        currentRoundNumber = 1;
        isTiebreaker = false;

        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        loadNextRound();
    }

    function backToMenu() {
        playSound("click");
        clearInterval(timerInterval);
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    }

    function updateScoreboard() {
        const list = document.getElementById("scoreboard-list");
        list.innerHTML = players.map((p, idx) => `
            <div class="score-card ${idx === currentPlayerIndex ? 'active' : ''}">
                ${p.name}: <strong>${p.score} Pkt.</strong>
            </div>
        `).join("");
    }

    function updateRoundBadge() {
        const badge = document.getElementById("round-badge");
        if (isTiebreaker) {
            badge.className = "badge badge-tiebreaker";
            badge.textContent = "⚡ Stechen!";
        } else {
            badge.className = "badge badge-round";
            badge.textContent = `Runde ${currentRoundNumber} / ${totalRoundsPerPlayer}`;
        }
    }

    function getAvailableCandidates(catKey, difficulty) {
        const clusters = DATABASE[catKey].clusters;
        let candidates = [];
        clusters.forEach(cluster => {
            const list = cluster[difficulty] || cluster.medium;
            list.forEach(term => {
                if (!sessionUsedTerms.has(term)) {
                    candidates.push({ term, cluster });
                }
            });
        });
        return candidates;
    }

    async function loadNextRound(retryCount = 0) {
        clearInterval(timerInterval);
        roundActive = false;
        revealedCount = 1;
        possiblePoints = 3;

        document.getElementById("feedback-box").classList.add("hidden");
        document.getElementById("next-round-btn").classList.add("hidden");
        document.getElementById("hint-btn").classList.remove("hidden");
        document.getElementById("hint-btn").disabled = false;
        document.getElementById("wiki-text").innerHTML = "<em>Suche passenden Wikipedia-Eintrag...</em>";
        document.getElementById("mc-area").classList.add("hidden");
        document.getElementById("text-area").classList.add("hidden");

        document.getElementById("current-player-display").textContent = players[currentPlayerIndex].name;
        updateRoundBadge();
        updatePointsBadge();
        updateScoreboard();

        const selectedCat = document.getElementById("category-select").value;
        const catKeys = Object.keys(DATABASE);
        currentCategoryKey = selectedCat === "all" ? catKeys[Math.floor(Math.random() * catKeys.length)] : selectedCat;
        document.getElementById("category-badge").textContent = DATABASE[currentCategoryKey].name;

        let candidates = getAvailableCandidates(currentCategoryKey, currentDifficulty);
        if (candidates.length === 0) {
            // Fallback auf andere Schwierigkeitsgrade derselben Kategorie, bevor Session-Reset erfolgt
            ["medium", "easy", "expert"].forEach(diff => {
                if (candidates.length === 0) {
                    candidates = getAvailableCandidates(currentCategoryKey, diff);
                }
            });
        }
        if (candidates.length === 0) {
            sessionUsedTerms.clear();
            candidates = getAvailableCandidates(currentCategoryKey, currentDifficulty);
        }

        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        currentTargetDe = chosen.term;
        currentCluster = chosen.cluster;
        sessionUsedTerms.add(currentTargetDe);

        const lang = document.getElementById("lang-select").value;

        try {
            const articleData = await fetchWikiArticle(currentTargetDe, lang);
            if (!articleData || articleData.paragraphs.length === 0) {
                if (retryCount < 6) return loadNextRound(retryCount + 1);
                throw new Error("Keine Artikelabsätze gefunden");
            }

            currentDisplayTitle = articleData.title;
            paragraphs = articleData.paragraphs;

            // Prüfen, ob im ersten Ausschnitt mindestens 3 ungeschwärzte Wörter sichtbar sind
            let visibleWords = countVisibleWords(paragraphs[0], currentDisplayTitle);
            if (visibleWords < 3 && paragraphs.length > 1) {
                // Zweiten Abschnitt dazunehmen als Starttext, falls erster fast komplett geschwärzt ist
                paragraphs = [paragraphs[0] + " " + paragraphs[1], ...paragraphs.slice(2)];
                visibleWords = countVisibleWords(paragraphs[0], currentDisplayTitle);
            }
            if (visibleWords < 3 && retryCount < 6) {
                return loadNextRound(retryCount + 1);
            }

            if (paragraphs.length < 2) {
                document.getElementById("hint-btn").classList.add("hidden");
            }

            renderWikiText(false);
            await setupAnswerArea(lang);
            roundActive = true;
            startTimer();
        } catch (err) {
            if (retryCount < 6) {
                return loadNextRound(retryCount + 1);
            }
            document.getElementById("wiki-text").innerHTML = "Wikipedia-Artikel konnte gerade nicht geladen werden. Bitte nächste Runde klicken.";
            document.getElementById("hint-btn").classList.add("hidden");
            document.getElementById("next-round-btn").classList.remove("hidden");
        }
    }

    async function fetchWikiArticle(germanTitle, targetLang) {
        let titleToFetch = germanTitle;

        if (targetLang !== "de") {
            const langLinkUrl = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(germanTitle)}&redirects=1&prop=langlinks&lllang=${targetLang}&format=json&origin=*`;
            const res = await fetch(langLinkUrl);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            if (pages[pageId] && pages[pageId].langlinks && pages[pageId].langlinks.length > 0) {
                titleToFetch = pages[pageId].langlinks[0]["*"];
            }
        }

        const apiUrl = `https://${targetLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&titles=${encodeURIComponent(titleToFetch)}&format=json&origin=*`;
        const response = await fetch(apiUrl);
        const json = await response.json();
        const pages = json.query.pages;
        const page = pages[Object.keys(pages)[0]];

        if (!page || page.missing || !page.extract) return null;

        let rawParagraphs = page.extract
            .split("\n")
            .map(p => p.trim())
            .filter(p => p.length > 45 && !p.startsWith("==") && !p.endsWith(":"));

        if (rawParagraphs.length === 0) return null;

        // Im Expertenmodus ersten Absatz überspringen, falls genügend weitere Absätze vorhanden sind
        if (currentDifficulty === "expert" && rawParagraphs.length > 2) {
            rawParagraphs = rawParagraphs.slice(1);
        }

        // Ersten Absatz in einen knackigen Einstieg (1. Satz) und den Rest aufteilen
        const firstPara = rawParagraphs[0];
        const sentenceMatch = firstPara.match(/^.+?[.!?](?:\s+|$)/);
        let structuredSegments = [];

        if (sentenceMatch && sentenceMatch[0].length >= 35 && firstPara.length - sentenceMatch[0].length >= 40) {
            const firstSentence = sentenceMatch[0].trim();
            const restOfFirst = firstPara.slice(sentenceMatch[0].length).trim();
            structuredSegments.push(firstSentence);
            structuredSegments.push(restOfFirst);
            if (rawParagraphs[1]) structuredSegments.push(rawParagraphs[1]);
        } else {
            structuredSegments = rawParagraphs.slice(0, 3);
        }

        return {
            title: page.title,
            paragraphs: structuredSegments.slice(0, 3)
        };
    }

    function removeAllBrackets(text) {
        let prev;
        let current = text;
        do {
            prev = current;
            current = current.replace(/\([^()]*\)/g, match => "█".repeat(Math.max(4, Math.min(18, match.length))));
            current = current.replace(/\[[^\[\]]*\]/g, match => "█".repeat(Math.max(4, Math.min(18, match.length))));
        } while (current !== prev);
        return current;
    }

    function redactPlainText(text, title) {
        let result = removeAllBrackets(text);
        const cleanTitle = title.replace(/\s*\(.*?\)\s*/g, "").trim();
        const stopWords = ["der", "die", "das", "von", "und", "den", "dem", "des", "für", "mit", "the", "and", "les", "des", "del", "della"];
        const words = cleanTitle.split(/[\s\-–]+/).filter(w => w.length > 2 && !stopWords.includes(w.toLowerCase()));

        if (cleanTitle.length > 1) {
            const fullRegex = new RegExp(escapeRegExp(cleanTitle), "gi");
            result = result.replace(fullRegex, match => "█".repeat(match.length));
        }

        words.forEach(word => {
            const wordRegex = new RegExp(`\\b${escapeRegExp(word)}[a-zäöüßéèêàâîôû']*`, "gi");
            result = result.replace(wordRegex, match => "█".repeat(match.length));
        });

        return result;
    }

    function countVisibleWords(text, title) {
        const redacted = redactPlainText(text, title);
        const plainWithoutBlocks = redacted.replace(/█+/g, " ");
        const words = plainWithoutBlocks.match(/[a-zA-ZäöüÄÖÜßéèêàâîôû]{3,}/g) || [];
        return words.length;
    }

    function formatRedactedHtml(text, title) {
        const plainRedacted = redactPlainText(text, title);
        return plainRedacted.replace(/█+/g, match => `<span class="redacted">${match}</span>`);
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderWikiText(revealAll) {
        const container = document.getElementById("wiki-text");
        const visibleParas = paragraphs.slice(0, revealedCount);
        container.innerHTML = visibleParas.map(p => {
            const content = revealAll ? p : formatRedactedHtml(p, currentDisplayTitle);
            return `<div class="wiki-paragraph">${content}</div>`;
        }).join("");
    }

    function revealNextHint() {
        if (!roundActive || revealedCount >= paragraphs.length) return;
        playSound("hint");
        revealedCount++;
        possiblePoints = Math.max(1, 4 - revealedCount);
        updatePointsBadge();
        renderWikiText(false);

        if (revealedCount >= paragraphs.length) {
            document.getElementById("hint-btn").disabled = true;
        }
    }

    function updatePointsBadge() {
        document.getElementById("points-badge").textContent = `Punkte: ${possiblePoints}`;
    }

    async function setupAnswerArea(lang) {
        const mode = document.getElementById("input-mode").value;
        if (mode === "mc") {
            const mcArea = document.getElementById("mc-area");
            mcArea.classList.remove("hidden");
            mcArea.innerHTML = "Lade Antwortmöglichkeiten...";

            // Erst Begriffe aus exakt demselben Cluster & Schwierigkeitsgrad sammeln
            let pool = (currentCluster[currentDifficulty] || []).filter(item => item !== currentTargetDe);
            if (pool.length < 3) {
                const allClusterTerms = [...(currentCluster.easy || []), ...(currentCluster.medium || []), ...(currentCluster.expert || [])];
                pool = [...new Set(allClusterTerms)].filter(item => item !== currentTargetDe);
            }

            const distractorsDe = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [currentDisplayTitle];

            for (const d of distractorsDe) {
                if (lang === "de") {
                    options.push(d);
                } else {
                    try {
                        const url = `https://de.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(d)}&redirects=1&prop=langlinks&lllang=${lang}&format=json&origin=*`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const p = j.query.pages[Object.keys(j.query.pages)[0]];
                        options.push(p && p.langlinks && p.langlinks.length > 0 ? p.langlinks[0]["*"] : d);
                    } catch (e) {
                        options.push(d);
                    }
                }
            }

            options = options.sort(() => 0.5 - Math.random());
            mcArea.innerHTML = "";
            options.forEach(opt => {
                const cleanOpt = opt.replace(/\s*\(.*?\)\s*/g, "");
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mc-btn";
                btn.textContent = cleanOpt;
                btn.onclick = () => checkMultipleChoice(btn, opt);
                mcArea.appendChild(btn);
            });
        } else {
            const textArea = document.getElementById("text-area");
            const input = document.getElementById("guess-input");
            textArea.classList.remove("hidden");
            input.value = "";
            input.disabled = false;
            input.focus();
        }
    }

    function checkMultipleChoice(btnElement, selectedOption) {
        if (!roundActive) return;
        const isCorrect = selectedOption === currentDisplayTitle;

        document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
        if (isCorrect) {
            btnElement.classList.add("correct");
            endRound(true);
        } else {
            btnElement.classList.add("wrong");
            endRound(false);
        }
    }

    function submitTextGuess() {
        if (!roundActive) return;
        const guess = document.getElementById("guess-input").value.trim().toLowerCase();
        if (!guess) return;

        const cleanTarget = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "").trim().toLowerCase();
        const targetParts = cleanTarget.split(" ");
        const lastName = targetParts[targetParts.length - 1];

        const isCorrect = guess === cleanTarget || (lastName.length >= 4 && guess === lastName);

        document.getElementById("guess-input").disabled = true;
        endRound(isCorrect);
    }

    function startTimer() {
        const limit = parseInt(document.getElementById("timer-select").value, 10);
        const timerBadge = document.getElementById("timer-badge");

        if (limit === 0) {
            timerBadge.classList.add("hidden");
            return;
        }

        timerBadge.classList.remove("hidden", "urgent");
        timeLeft = limit;
        timerBadge.textContent = `⏱ ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 5 && timeLeft > 0) {
                playSound("tick");
            }
            if (timeLeft <= 10) {
                timerBadge.classList.add("urgent");
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endRound(false, true);
            }
        }, 1000);
    }

    function endRound(won, timeOut = false) {
        roundActive = false;
        clearInterval(timerInterval);
        renderWikiText(true);

        const feedback = document.getElementById("feedback-box");
        feedback.classList.remove("hidden", "win", "lose", "info");

        const cleanTitle = currentDisplayTitle.replace(/\s*\(.*?\)\s*/g, "");

        if (won) {
            playSound("win");
            players[currentPlayerIndex].score += possiblePoints;
            feedback.classList.add("win");
            feedback.textContent = `🎉 Richtig! Gesucht war „${cleanTitle}“. +${possiblePoints} Punkt(e) für ${players[currentPlayerIndex].name}!`;
        } else {
            playSound("lose");
            feedback.classList.add("lose");
            feedback.textContent = timeOut
                ? `⏱ Zeit abgelaufen! Gesucht war „${cleanTitle}“. 0 Punkte.`
                : `❌ Leider falsch! Gesucht war „${cleanTitle}“. 0 Punkte.`;
        }

        updateScoreboard();
        document.getElementById("hint-btn").classList.add("hidden");
        document.getElementById("next-round-btn").classList.remove("hidden");
    }

    function nextTurn() {
        playSound("click");
        activeTurnPointer++;

        if (activeTurnPointer < activePlayerIndices.length) {
            currentPlayerIndex = activePlayerIndices[activeTurnPointer];
            loadNextRound();
            return;
        }

        // Alle aktiven Spieler haben ihre Runde absolviert
        activeTurnPointer = 0;

        if (!isTiebreaker) {
            if (currentRoundNumber < totalRoundsPerPlayer) {
                currentRoundNumber++;
                currentPlayerIndex = activePlayerIndices[0];
                loadNextRound();
                return;
            }
        }

        // Prüfen auf Gleichstand an der Spitze (nur bei Multiplayer)
        if (players.length > 1) {
            const maxScore = Math.max(...activePlayerIndices.map(idx => players[idx].score));
            const tiedIndices = activePlayerIndices.filter(idx => players[idx].score === maxScore);

            if (tiedIndices.length > 1) {
                isTiebreaker = true;
                activePlayerIndices = tiedIndices;
                activeTurnPointer = 0;
                currentPlayerIndex = activePlayerIndices[0];
                const names = tiedIndices.map(idx => players[idx].name).join(" & ");
                alert(`⚡ Gleichstand mit ${maxScore} Punkten! Es folgt ein Stechen zwischen: ${names}`);
                loadNextRound();
                return;
            }
        }

        showPodium();
    }

    function showPodium() {
        playSound("fanfare");
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");

        const sorted = [...players].sort((a, b) => b.score - a.score);
        const podiumList = document.getElementById("podium-list");
        podiumList.innerHTML = sorted.map((p, idx) => {
            const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}.`;
            return `
                <li class="podium-item ${idx === 0 ? 'first' : ''}">
                    <span>${medal} ${p.name}</span>
                    <strong>${p.score} Punkte</strong>
                </li>
            `;
        }).join("");
    }
</script>
